<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>多智能体协同 RAG 医疗咨询助手</title>

  <!-- CDN 引入 Tailwind CSS v3（无需本地依赖） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',        // 主色：柔和科技蓝
            'primary-dark': '#0E42D2',
            'primary-light': '#E8F3FF',// 辅助浅蓝
            'text-main': '#1D2129',
            'text-sub': '#6E7681',
            danger: '#F53F3F'
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    }
    /* 移动端视口高度：100dvh 避免键盘弹出遮挡输入框，100vh 兜底兼容旧浏览器 */
    .app-height { height: 100vh; height: 100dvh; }

    /* 滚动条美化 */
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #D3DAE6; border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #B8C2D0; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }

    /* AI 打字加载动画（三个点跳动） */
    @keyframes typingBlink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    .typing-dot { animation: typingBlink 1.2s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>

<body class="app-height bg-[#F7F9FC] text-text-main antialiased overflow-hidden flex flex-col">
  <!-- ==================== 顶部导航栏 ==================== -->
  <header class="h-16 shrink-0 bg-white/90 backdrop-blur border-b border-gray-100 flex items-center px-3 sm:px-5 gap-2 z-20">
    <!-- 手机端汉堡按钮（展开历史侧边栏） -->
    <button id="menuBtn" class="md:hidden p-2 rounded-lg text-text-main hover:bg-primary-light transition" aria-label="打开历史会话">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Logo + 应用名 -->
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center text-white shadow-md shadow-primary/25 shrink-0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>
      <div class="leading-tight min-w-0">
        <p class="font-semibold text-[15px] truncate">多智能体协同 RAG 医疗咨询助手</p>
        <p class="text-[11px] text-text-sub truncate">AI 健康科普 · 在线咨询</p>
      </div>
    </div>

    <div class="flex-1"></div>

    <!-- 右上角用户区 -->
    <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
      <div class="flex items-center gap-2">
        <div id="userAvatar" class="w-9 h-9 rounded-full bg-primary-light text-primary font-semibold flex items-center justify-center">医</div>
        <span id="userName" class="hidden sm:block text-sm font-medium text-text-main max-w-[120px] truncate">用户</span>
      </div>
      <button id="logoutBtn" class="text-sm px-2.5 sm:px-3 py-1.5 rounded-lg text-text-sub hover:text-danger hover:bg-red-50 transition flex items-center gap-1.5" title="退出登录">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
        </svg>
        <span class="hidden sm:inline">退出</span>
      </button>
    </div>
  </header>

  <!-- ==================== 主体区域 ==================== -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- 手机端遮罩层（点击空白关闭侧边栏） -->
    <div id="overlay" class="fixed inset-0 bg-black/40 z-30 hidden md:hidden"></div>

    <!-- ① 左侧历史会话侧边栏（PC 永久展开 / 手机抽屉） -->
    <aside id="sidebar"
      class="fixed md:static inset-y-0 left-0 z-40 w-[280px] md:w-72 bg-white border-r border-gray-100 flex flex-col shrink-0 transition-transform duration-300 -translate-x-full md:translate-x-0">
      <div class="p-4 border-b border-gray-100">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-[15px] flex items-center gap-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v18M3 12h18"/>
            </svg>
            历史会话
          </h2>
          <!-- 手机端关闭按钮 -->
          <button id="closeSidebarBtn" class="md:hidden p-2 rounded-lg text-text-sub hover:bg-gray-100 transition" aria-label="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <!-- 新建会话按钮 -->
        <button id="newChatBtn"
          class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-primary hover:bg-primary-dark active:scale-[0.98] text-white text-sm font-medium shadow-md shadow-primary/20 transition">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          新建会话
        </button>
        <!-- 清空全部历史 -->
        <button id="clearAllBtn" class="w-full mt-2 text-xs text-text-sub hover:text-danger transition py-1.5 rounded-lg hover:bg-red-50">
          清空全部历史
        </button>
      </div>

      <!-- 会话列表 -->
      <div id="sessionList" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-1.5"></div>
    </aside>

    <!-- ② 中间聊天主体 -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#F7F9FC]">

      <!-- 消息滚动区 -->
      <div id="messageArea" class="flex-1 overflow-y-auto custom-scroll px-4 py-6">
        <div id="messageContainer" class="max-w-3xl mx-auto space-y-5"></div>
      </div>

      <!-- 底部输入区 -->
      <div class="shrink-0 bg-white border-t border-gray-100" style="padding-bottom: env(safe-area-inset-bottom);">
        <div class="max-w-3xl mx-auto px-3 sm:px-4 pt-3 pb-2">
          <div class="flex items-end gap-2 bg-[#FAFCFF] rounded-2xl border border-gray-200 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 p-2 transition">
            <!-- 多行自适应输入框 -->
            <textarea id="input" rows="1" placeholder="请输入您的健康问题，如：最近总是头痛怎么办？"
              class="flex-1 resize-none bg-transparent outline-none text-sm text-text-main placeholder:text-text-sub/70 leading-relaxed py-2 px-2 max-h-[140px]"></textarea>
            <!-- 发送按钮 -->
            <button id="sendBtn" class="shrink-0 w-10 h-10 rounded-xl bg-primary hover:bg-primary-dark active:scale-95 text-white flex items-center justify-center shadow-md shadow-primary/25 transition" title="发送" aria-label="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/>
              </svg>
            </button>
          </div>
          <!-- 永久固定安全提示 -->
          <p class="text-center text-[11px] text-text-sub mt-2 leading-relaxed">
            ⚠️ AI医疗助手仅提供健康科普参考，不构成医疗诊断，如有身体不适，请及时前往医院就诊。
          </p>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      // ================== 常量与鉴权 ==================
      const TOKEN_KEY = 'rag_med_token';
      const USER_KEY  = 'rag_med_username';
      // 每条 AI 回答底部固定提示
      const AI_DISCLAIMER = '本AI仅供健康参考，不能替代执业医师诊断，身体不适请及时线下就医';

      const token = localStorage.getItem(TOKEN_KEY);
      const username = localStorage.getItem(USER_KEY);

      // 未登录强制跳转登录页
      if (!token) {
        window.location.replace('login.html');
        return;
      }

      // 会话按 token 隔离存储：同一 token（同一账号）在任意设备都能读到同一份历史，
      // 从而模拟“跨设备登录看到同样历史记录”的效果。
      const STORE_KEY = 'rag_med_sessions_' + token;

      let sessions = [];     // 全部会话
      let currentId = null;  // 当前会话 id
      let isTyping = false;  // AI 是否在“打字中”

      // ================== 工具函数 ==================
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }
      function pad(n) { return String(n).padStart(2, '0'); }
      function formatTime(ts) {
        const d = new Date(ts), now = new Date();
        const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
        if (d.toDateString() === now.toDateString()) return hm;
        if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm;
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + pad(d.getDate());
      }
      // 会话标题：取第一条用户提问
      function sessionTitle(s) {
        const first = (s.messages || []).find(m => m.role === 'user');
        const title = first ? first.content : '新的会话';
        return title.length > 18 ? title.slice(0, 18) + '…' : title;
      }
      function sortSessions() { sessions.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); }

      // ================== 本地存储读写 ==================
      function loadSessions() {
        try { sessions = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
        catch (e) { sessions = []; }
      }
      function saveSessions() {
        localStorage.setItem(STORE_KEY, JSON.stringify(sessions));
      }

      // ================== DOM 引用 ==================
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const sessionList = document.getElementById('sessionList');
      const messageContainer = document.getElementById('messageContainer');
      const messageArea = document.getElementById('messageArea');
      const input = document.getElementById('input');

      // ================== 侧边栏（移动端抽屉） ==================
      function openSidebar() { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
      function closeSidebar() { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
      document.getElementById('menuBtn').addEventListener('click', openSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
      overlay.addEventListener('click', closeSidebar);

      // ================== 渲染：侧边栏 ==================
      function renderSidebar() {
        if (!sessions.length) {
          sessionList.innerHTML = '<div class="text-center text-text-sub text-xs py-10 px-4 leading-relaxed">暂无历史会话<br/>点击“新建会话”开始咨询</div>';
          return;
        }
        sessionList.innerHTML = sessions.map(s => {
          const active = s.id === currentId;
          return `
            <div class="group session-item rounded-xl px-3 py-2.5 cursor-pointer transition flex items-center gap-2 ${active ? 'bg-primary-light/70' : 'hover:bg-gray-50'}" data-id="${s.id}">
              <div class="flex-1 min-w-0" data-action="switch">
                <p class="text-sm font-medium truncate ${active ? 'text-primary' : 'text-text-main'}">${escapeHtml(sessionTitle(s))}</p>
                <p class="text-[11px] text-text-sub mt-0.5">${formatTime(s.updatedAt)}</p>
              </div>
              <button class="shrink-0 p-1.5 rounded-lg text-text-sub hover:text-danger hover:bg-red-50 transition md:opacity-0 md:group-hover:opacity-100" data-action="delete" title="删除该会话" aria-label="删除会话">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            </div>`;
        }).join('');
      }

      // ================== 渲染：消息区 ==================
      function userBubble(m) {
        return `
          <div class="flex justify-end">
            <div class="max-w-[80%] sm:max-w-[70%] bg-primary text-white rounded-2xl rounded-tr-md px-4 py-3 shadow-md shadow-primary/15">
              <p class="text-sm leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(m.content)}</p>
              <p class="text-[10px] text-white/60 text-right mt-1">${formatTime(m.time)}</p>
            </div>
          </div>`;
      }
      function aiBubble(m) {
        return `
          <div class="flex justify-start gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-primary-light text-primary flex items-center justify-center shrink-0 mt-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </div>
            <div class="max-w-[85%] sm:max-w-[75%]">
              <div class="bg-white rounded-2xl rounded-tl-md shadow-sm border border-gray-100 px-4 py-3">
                <p class="text-[11px] font-medium text-primary mb-1">AI 医疗助手</p>
                <p class="text-sm leading-relaxed whitespace-pre-wrap break-words text-text-main">${escapeHtml(m.content)}</p>
                <p class="text-[10px] text-text-sub text-right mt-1.5">${formatTime(m.time)}</p>
              </div>
              <!-- AI 回答底部固定免责提示 -->
              <p class="text-[10px] text-text-sub/80 mt-1 px-1 flex items-start gap-1 leading-relaxed">
                <svg class="mt-0.5 shrink-0" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                <span>${AI_DISCLAIMER}</span>
              </p>
            </div>
          </div>`;
      }
      function typingBubble() {
        return `
          <div class="flex justify-start gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-primary-light text-primary flex items-center justify-center shrink-0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </div>
            <div class="bg-white rounded-2xl rounded-tl-md shadow-sm border border-gray-100 px-4 py-4">
              <div class="flex gap-1.5">
                <span class="typing-dot w-2 h-2 rounded-full bg-primary"></span>
                <span class="typing-dot w-2 h-2 rounded-full bg-primary"></span>
                <span class="typing-dot w-2 h-2 rounded-full bg-primary"></span>
              </div>
            </div>
          </div>`;
      }
      function emptyState() {
        const chips = ['最近总是失眠怎么办', '高血压平时要注意什么', '感冒咳嗽怎么护理', '体检报告怎么看'];
        return `
          <div class="flex flex-col items-center justify-center text-center py-14 px-4">
            <div class="w-16 h-16 rounded-2xl bg-primary-light flex items-center justify-center text-primary mb-4">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-text-main">你好，我是 AI 医疗助手</h3>
            <p class="text-sm text-text-sub mt-2 max-w-sm leading-relaxed">基于多智能体协同 + RAG 检索增强的医疗健康咨询服务，请描述您的健康疑问。</p>
            <div class="flex flex-wrap justify-center gap-2 mt-6">
              ${chips.map(c => `<button data-chip class="text-xs sm:text-sm px-4 py-2 rounded-full bg-white border border-gray-200 text-text-sub hover:text-primary hover:border-primary hover:bg-primary-light/40 transition">${c}</button>`).join('')}
            </div>
          </div>`;
      }
      function renderMessages() {
        const session = sessions.find(s => s.id === currentId);
        if (!session || !session.messages.length) {
          messageContainer.innerHTML = emptyState();
          return;
        }
        messageContainer.innerHTML = session.messages.map(m => m.role === 'user' ? userBubble(m) : aiBubble(m)).join('');
        if (isTyping) messageContainer.insertAdjacentHTML('beforeend', typingBubble());
        scrollToBottom();
      }
      function scrollToBottom() {
        requestAnimationFrame(() => { messageArea.scrollTop = messageArea.scrollHeight; });
      }

      // ================== 会话操作 ==================
      function createSession() {
        const id = 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const now = Date.now();
        sessions.unshift({ id, title: '新的会话', messages: [], createdAt: now, updatedAt: now });
        currentId = id;
        saveSessions(); renderSidebar(); renderMessages();
        return id;
      }
      function switchSession(id) {
        currentId = id;
        renderSidebar(); renderMessages();
      }
      function deleteSession(id) {
        if (!confirm('确定删除该会话吗？')) return;
        sessions = sessions.filter(s => s.id !== id);
        if (currentId === id) currentId = sessions.length ? sessions[0].id : null;
        saveSessions(); renderSidebar(); renderMessages();
      }
      function clearAll() {
        if (!sessions.length) return;
        if (!confirm('确定清空全部历史会话吗？此操作不可恢复。')) return;
        sessions = []; currentId = null;
        saveSessions(); renderSidebar(); renderMessages();
      }

      // 侧边栏事件委托：切换会话 / 删除会话
      sessionList.addEventListener('click', e => {
        const item = e.target.closest('.session-item');
        if (!item) return;
        const id = item.dataset.id;
        if (e.target.closest('[data-action="delete"]')) { e.stopPropagation(); deleteSession(id); return; }
        switchSession(id);
        closeSidebar();
      });
      document.getElementById('newChatBtn').addEventListener('click', () => { createSession(); closeSidebar(); });
      document.getElementById('clearAllBtn').addEventListener('click', clearAll);

      // 空状态推荐问题（点击即发送）
      messageContainer.addEventListener('click', e => {
        const chip = e.target.closest('[data-chip]');
        if (chip) { input.value = chip.textContent.trim(); autoResize(); sendMessage(); }
      });

      // ================== 模拟 AI 回复（多 Agent RAG） ==================
      function pickReply(text) {
        const hit = kws => kws.some(k => text.includes(k));
        if (hit(['失眠', '睡不着', '睡眠', '多梦'])) return `关于睡眠问题，以下几点健康建议供您参考：

1. 保持规律作息，尽量固定起床和入睡时间；
2. 睡前一小时减少使用手机等电子屏幕，避免咖啡因、浓茶；
3. 卧室保持安静、昏暗、温度适宜；
4. 白天适当运动，但避免睡前剧烈运动。

如果长期失眠或伴随明显情绪波动，建议前往医院神经内科或睡眠专科进一步评估。`;
        if (hit(['感冒', '咳嗽', '流鼻涕', '喉咙', '嗓子'])) return `关于感冒的日常护理建议：

1. 多喝温水、清淡饮食，保证充分休息；
2. 注意室内通风，勤洗手，避免交叉感染；
3. 普通感冒多为病毒感染，通常 5-7 天可自行缓解；
4. 如出现持续高热、呼吸困难、胸痛等情况，请及时就医。

不建议自行随意服用抗生素，请在医生或药师指导下用药。`;
        if (hit(['发烧', '发热', '体温', '退烧'])) return `关于发热，请先观察体温与伴随症状：

1. 体温 38.5℃ 以下、精神状态尚可，可先物理降温并多饮水；
2. 持续高热或伴有寒战、皮疹、意识改变等，应尽快就医；
3. 注意监测体温变化，不要盲目叠加使用退热药；
4. 儿童、老人、孕妇及有基础疾病者更应警惕，及时就医。

以上为健康科普，具体用药与诊断请遵医嘱。`;
        if (hit(['头痛', '头疼', '偏头痛'])) return `关于头痛的常见情况：

3. 若头痛剧烈、突发，伴喷射性呕吐、肢体无力或言语不清，请立即急诊就医；

请勿长期依赖止痛药，具体请遵医嘱。`;
        if (hit(['胃', '肚子', '腹泻', '拉肚子', '恶心', '呕吐'])) return `关于胃肠道不适的日常建议：

        if (hit(['高血压', '血压'])) return `关于高血压的日常管理建议：

      }
      function mockAiReply(text) {
        return new Promise(resolve => {
          const delay = 900 + Math.random() * 700; // 模拟后端响应延迟
          setTimeout(() => resolve(pickReply(text)), delay);
        });
      }

      // ================== 消息收发 ==================
      function appendMessage(role, content) {
        const session = sessions.find(s => s.id === currentId);
        if (!session) return;
        session.messages.push({ role, content, time: Date.now() });
        session.updatedAt = Date.now();
        sortSessions();
        saveSessions();
        renderSidebar();
        renderMessages();
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return; // 禁止发送空消息

        if (!currentId) createSession(); // 无会话时自动新建

        // 先渲染并保存用户消息
        appendMessage('user', text);
        input.value = '';
        autoResize();

        // 显示 AI 打字加载动画
        isTyping = true;
        renderMessages();

        // ============【这里对接后端API】============
        // 真实后端接入示例（对接 FastAPI 多 Agent 医疗后端）：
        // 支持流式 SSE 输出：
        //
        // const resp = await fetch('/api/chat', {
        //   method: 'POST',
        //   headers: {
        //     'Content-Type': 'application/json',
        //     'Authorization': 'Bearer ' + token
        //   },
        //   body: JSON.stringify({ session_id: currentId, message: text })
        // });
        // const data = await resp.json();
        // const answer = data.answer;
        // ===========================================

        const reply = await mockAiReply(text); // 模拟 AI 延迟响应
        isTyping = false;
        appendMessage('assistant', reply);
      }

      // ================== 输入框交互 ==================
      function autoResize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      }
      input.addEventListener('input', autoResize);
      input.addEventListener('keydown', e => {
        // 回车发送，Shift+Enter 换行；中文输入法组词时(composing)不触发
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          sendMessage();
        }
      });
      document.getElementById('sendBtn').addEventListener('click', sendMessage);

      // ================== 退出登录 ==================
      document.getElementById('logoutBtn').addEventListener('click', () => {
        if (!confirm('确定退出登录吗？')) return;
        // 仅清除登录态，历史会话仍按 token 保存在本地，下次同账号登录可恢复（模拟跨设备）
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        window.location.replace('login.html');
      });

      // ================== 初始化 ==================
      document.getElementById('userName').textContent = username || '用户';
      document.getElementById('userAvatar').textContent = (username || '医').charAt(0);
      loadSessions();
      sortSessions();
      if (sessions.length) currentId = sessions[0].id; // 默认选中最新会话
      renderSidebar();
      renderMessages();
    })();
  </script>
