<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ClinicMind Health Assistant</title>

  <!-- 字体：Inter（拉丁/数字）+ Noto Sans SC（中文），工整高级的无衬线字族 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- CDN 引入 Tailwind CSS v3（无需本地依赖） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#5B2C6F',        // 主色：手术服深紫
            'primary-dark': '#452256',
            'primary-light': '#F1EAF6',// 辅助浅紫（标签/浅底）
            'text-main': '#1D2129',
            'text-sub': '#6E7681',
            danger: '#F53F3F',
            success: '#00B42A',
            warning: '#FF7D00'
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", sans-serif;
      text-rendering: optimizeLegibility;
    }
    /* 标题与品牌名：轻微收紧字距，更显工整高级 */
    h1, h2, h3 { letter-spacing: -0.01em; }
    /* 移动端视口高度：100dvh 避免键盘弹出遮挡输入框，100vh 兜底兼容旧浏览器 */
    .app-height { height: 100vh; height: 100dvh; }

    /* 滚动条美化 */
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #D8CDE8; border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #C2B3DA; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }

    /* AI 打字加载动画（三个点跳动） */
    @keyframes typingBlink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    .typing-dot { animation: typingBlink 1.2s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    /* 会诊阶段：执行中呼吸灯 */
    @keyframes stagePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(91, 44, 111, 0.35); }
      50% { box-shadow: 0 0 0 5px rgba(91, 44, 111, 0.08); }
    }
    .stage-running { animation: stagePulse 1.2s ease-in-out infinite; }

    /* 检索结果内容多行截断 */
    .line-clamp-4 {
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ---------- 图表设计变量（数据可视化规范：浅色主题） ---------- */
    .viz-root {
      color-scheme: light;
      --surface-1:      #fcfcfb;   /* 图表表面 */
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --muted:          #898781;   /* 轴/标签 */
      --series-1:       #8C5FB3;   /* 单序列紫 */
      --grid-line:      #e1e0d9;   /* 网格线（hairline） */
      --axis:           #c3c2b7;   /* 基线/坐标轴 */
      --ring:           #fcfcfb;   /* 标记点表面描边 */
    }
  </style>
</head>

<body class="app-height bg-[#F7F6FA] text-text-main antialiased overflow-hidden flex flex-col">
  <!-- ==================== 顶部导航栏 ==================== -->
  <header class="h-16 shrink-0 bg-white/90 backdrop-blur border-b border-gray-100 flex items-center px-3 sm:px-5 gap-2 z-20 relative">
    <!-- 手机端汉堡按钮（展开历史侧边栏） -->
    <button id="menuBtn" class="md:hidden p-2 rounded-lg text-text-main hover:bg-primary-light transition" aria-label="打开历史会话">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Logo + 应用名（点击回首页） -->
    <button id="logoBtn" class="flex items-center gap-2.5 min-w-0 text-left" title="返回首页">
      <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center text-white shadow-md shadow-primary/25 shrink-0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>
      <div class="leading-tight min-w-0">
        <p class="font-semibold text-[15px] truncate">ClinicMind Health Assistant</p>
        <p class="text-[11px] text-text-sub truncate">AI 健康科普 · 在线咨询</p>
      </div>
    </button>

    <div class="flex-1"></div>

    <!-- 右上角：全部功能小图标（跳转独立功能页，收纳所有功能模块） -->
    <a href="features.html" id="featureBtn" class="shrink-0 p-2 rounded-lg text-text-main hover:bg-primary-light transition" title="全部功能" aria-label="全部功能">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
    </a>

    <!-- 右上角用户区 -->
    <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
      <div class="flex items-center gap-2">
        <div id="userAvatar" class="w-9 h-9 rounded-full bg-primary-light text-primary font-semibold flex items-center justify-center">医</div>
        <span id="userName" class="hidden sm:block text-sm font-medium text-text-main max-w-[120px] truncate">用户</span>
      </div>
      <button id="logoutBtn" class="text-sm px-2.5 sm:px-3 py-1.5 rounded-lg text-text-sub hover:text-danger hover:bg-red-50 transition flex items-center gap-1.5" title="退出登录">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
        </svg>
        <span id="logoutLabel" class="hidden sm:inline">退出</span>
      </button>
    </div>
  </header>

  <!-- ==================== 主体区域 ==================== -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- 手机端遮罩层（点击空白关闭侧边栏/功能菜单） -->
    <div id="overlay" class="fixed inset-0 bg-black/40 z-30 hidden md:hidden"></div>

    <!-- ① 左侧历史会话侧边栏（PC 永久展开 / 手机抽屉） -->
    <aside id="sidebar"
      class="fixed md:static inset-y-0 left-0 z-40 w-[280px] md:w-72 bg-white border-r border-gray-100 flex flex-col shrink-0 transition-transform duration-300 -translate-x-full md:translate-x-0">
      <div class="p-4 border-b border-gray-100">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-[15px]">历史会话</h2>
          <!-- 手机端关闭按钮 -->
          <button id="closeSidebarBtn" class="md:hidden p-2 rounded-lg text-text-sub hover:bg-gray-100 transition" aria-label="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <!-- 新建会话按钮 -->
        <button id="newChatBtn"
          class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-primary hover:bg-primary-dark active:scale-[0.98] text-white text-sm font-medium shadow-md shadow-primary/20 transition">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          新建会话
        </button>
        <!-- 清空全部历史 -->
        <button id="clearAllBtn" class="w-full mt-2 text-xs text-text-sub hover:text-danger transition py-1.5 rounded-lg hover:bg-red-50">
          清空全部历史
        </button>
      </div>

      <!-- 会话列表 -->
      <div id="sessionList" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-1.5"></div>
    </aside>

    <!-- ② 中间内容主体 -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#F7F6FA]">

      <!-- 消息滚动区 -->
      <div id="messageArea" class="flex-1 overflow-y-auto custom-scroll px-4 py-6">
        <div id="messageContainer" class="max-w-3xl mx-auto space-y-5"></div>
      </div>

      <!-- 底部输入区（首页/服务模式隐藏） -->
      <div id="bottomBar" class="hidden shrink-0 bg-white border-t border-gray-100" style="padding-bottom: env(safe-area-inset-bottom);">
        <div class="max-w-3xl mx-auto px-3 sm:px-4 pt-3 pb-2">
          <!-- 模式提示行 + 会诊携带健康档案开关 -->
          <div class="flex items-center justify-between mb-2 px-1 gap-2">
            <p id="modeHint" class="text-[11px] text-text-sub truncate"></p>
            <label id="profileToggle" class="hidden shrink-0 text-[11px] text-text-sub cursor-pointer select-none flex items-center gap-1" title="会诊时把您的健康档案（病史/过敏史等）一并提供给大模型">
              <input type="checkbox" id="profileChk" class="accent-primary" />
              携带健康档案会诊
            </label>
          </div>
          <div id="inputBar" class="flex items-end gap-2 bg-[#FAF9FC] rounded-2xl border border-gray-200 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 p-2 transition">
            <!-- 多行自适应输入框 -->
            <textarea id="input" rows="1" maxlength="2000" placeholder="请输入您的健康问题，如：最近总是头痛怎么办？"
              class="flex-1 resize-none bg-transparent outline-none text-sm text-text-main placeholder:text-text-sub/70 leading-relaxed py-2 px-2 max-h-[140px]"></textarea>
            <!-- 发送按钮 -->
            <button id="sendBtn" class="shrink-0 w-10 h-10 rounded-xl bg-primary hover:bg-primary-dark active:scale-95 text-white flex items-center justify-center shadow-md shadow-primary/25 transition" title="发送" aria-label="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/>
              </svg>
            </button>
          </div>
          <!-- 永久固定安全提示 -->
          <p class="text-center text-[11px] text-text-sub mt-2 leading-relaxed">
            ClinicMind 医疗助手仅提供健康科普参考，不构成医疗诊断，如有身体不适，请及时前往医院就诊。
          </p>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      // ================== 常量与鉴权 ==================
      const TOKEN_KEY = 'rag_med_token';
      const USER_KEY  = 'rag_med_username';
      const AI_DISCLAIMER = '本AI仅供健康参考，不能替代执业医师诊断，身体不适请及时线下就医';

      // 前端由 FastAPI 同源托管，API 走相对路径
      const API_BASE = '';

      const token = localStorage.getItem(TOKEN_KEY);
      const username = localStorage.getItem(USER_KEY);
      // 欢迎语用户名（登录后由 /api/auth/me 校准；访客为 null → 展示「访客」）
      let displayName = username;

      // 会话按 token 隔离存储（同一账号多设备共享；访客用 guest 隔离）
      const STORE_KEY = 'rag_med_sessions_' + (token || 'guest');

      // ================== 功能模式（首页 + 咨询 3 种 + 服务 7 种） ==================
      const MODE = {
        HOME: 'home',
        CHAT: 'chat', AGENT: 'agent', SEARCH: 'search',
        APPT: 'appt', HOSPITAL: 'hospital', VISION: 'vision', PROFILE: 'profile',
        REPORT: 'report', MEDS: 'meds', TRENDS: 'trends', FAQ: 'faq',
      };
      let currentMode = MODE.HOME;

      // 无输入框模式：首页 + 全部服务面板
      const SERVICE_MODES = [MODE.HOME, MODE.APPT, MODE.HOSPITAL, MODE.VISION, MODE.PROFILE,
                             MODE.REPORT, MODE.MEDS, MODE.TRENDS, MODE.FAQ];

      const MODE_META = {
        [MODE.CHAT]: {
          hint: '智能问答：大模型直接快速回答日常健康问题（无多智能体流程）',
          placeholder: '请输入您的健康问题，如：最近总是头痛怎么办？',
        },
        [MODE.AGENT]: {
          hint: '多智能体会诊：Supervisor 组织 问诊→症状/RAG/风险并行分析→专科→综合回答 全流程',
          placeholder: '请描述您的症状，如：我最近总是头晕，持续三天了…',
        },
        [MODE.SEARCH]: {
          hint: '知识库检索：直接检索《内科学》《外科学》（第10版）教材知识库',
          placeholder: '输入医学关键词，如：高血压的饮食注意事项',
        },
      };

      // 功能图标（统一线性 SVG，用于首页欢迎区与各服务面板）
      const ICONS = {
        chat: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
        users: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>',
        calendar: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg>',
        pin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
        camera: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
        file: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
        user: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
        trend: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m23 6-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>',
        bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
        help: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        home: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
      };

      // 会诊各 Agent 展示信息（过程面板）
      const AGENT_META = {
        plan:      { label: '流程规划' },
        inquiry:   { label: '问诊分析' },
        symptom:   { label: '症状分析' },
        rag:       { label: '知识检索 RAG' },
        risk:      { label: '风险评估' },
        specialty: { label: '专科分析' },
        answer:    { label: '生成回答' },
      };

      let sessions = [];     // 全部会话
      let currentId = null;  // 当前会话 id
      let isTyping = false;  // AI 是否在生成中

      // ================== 工具函数 ==================
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }
      // 极简 Markdown：先转义再渲染 **加粗**，保证安全
      function renderInlineMd(text) {
        return escapeHtml(text).replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold">$1</strong>');
      }
      function pad(n) { return String(n).padStart(2, '0'); }
      function formatTime(ts) {
        const d = new Date(ts), now = new Date();
        const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
        if (d.toDateString() === now.toDateString()) return hm;
        if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm;
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + pad(d.getDate());
      }
      function sessionTitle(s) {
        const first = (s.messages || []).find(m => m.role === 'user');
        const title = first ? first.content : '新的会话';
        return title.length > 18 ? title.slice(0, 18) + '…' : title;
      }
      function sortSessions() { sessions.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); }
      function sourceLabel(s) {
        const name = String(s.source || '').split('/').pop();
        return name + (s.page ? ' 第' + s.page + '页' : '');
      }

      // ================== 本地存储读写 ==================
      function loadSessions() {
        try { sessions = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
        catch (e) { sessions = []; }
      }
      function saveSessions() {
        localStorage.setItem(STORE_KEY, JSON.stringify(sessions));
      }

      // ================== DOM 引用 ==================
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const sessionList = document.getElementById('sessionList');
      const messageContainer = document.getElementById('messageContainer');
      const messageArea = document.getElementById('messageArea');
      const input = document.getElementById('input');
      const modeHint = document.getElementById('modeHint');

      // ================== 侧边栏（移动端抽屉） ==================
      function openSidebar() { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
      function closeSidebar() { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
      document.getElementById('menuBtn').addEventListener('click', openSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
      overlay.addEventListener('click', closeSidebar);
      document.getElementById('logoBtn').addEventListener('click', () => { location.href = 'home.html'; });

      // ================== 渲染：侧边栏 ==================
      function renderSidebar() {
        if (!sessions.length) {
          sessionList.innerHTML = '<div class="text-center text-text-sub text-xs py-10 px-4 leading-relaxed">暂无历史会话<br/>点击"新建会话"开始咨询</div>';
          return;
        }
        sessionList.innerHTML = sessions.map(s => {
          const active = s.id === currentId;
          return `

      // ================== 服务面板：通用 ==================
      async function apiFetch(path, options) {
        const opts = options || {};
        const headers = Object.assign({}, opts.headers || {});
        if (token) headers['Authorization'] = 'Bearer ' + token;
        if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
        let resp;
        try {
          resp = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
        } catch (e) {
          return { ok: false, status: 0, data: { detail: '无法连接服务器，请确认后端服务已启动' } };
        }
        let data = null;
        try { data = await resp.json(); } catch (e) { data = {}; }
        return { ok: resp.ok, status: resp.status, data };
      }
      function serviceShell(inner) {
        return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 sm:p-6">${inner}</div>`;

      function apptHeaderHtml() {
        const steps = ['选科室', '选时段', '填信息', '挂号单'];
        return `
          <div class="flex items-center justify-between mb-3">

            }).join('')}

      async function renderApptStep1() {

                <span class="block text-[11px] text-text-sub mt-0.5">${escapeHtml(h.level)} · ${escapeHtml(h.city)}${escapeHtml(h.district)} · 参考距离 ${h.distance_km}km</span>

      async function renderSchedulePicker() {
        const body = document.getElementById('apptStep1Body');
        if (!body) return;
        body.innerHTML = '<p class="text-sm text-text-sub text-center py-6">正在加载未来 7 天排班…</p>';
        const res = await apiFetch(`/api/hospitals/schedule?hospital_id=${apptHospital.id}&department=${encodeURIComponent(apptDep)}`);
        if (!res.ok) {
          body.innerHTML = `<p class="text-sm text-danger text-center py-6">排班加载失败：${escapeHtml((res.data && res.data.detail) || '')}</p>`;
          return;

        apptSchedule = res.data;
        apptPickDate = apptSchedule.dates[0];
        body.innerHTML = `
          <p class="text-xs text-text-sub mb-1">就诊日期：</p>
          <div id="dateRow" class="flex gap-1.5 overflow-x-auto custom-scroll pb-2 mb-2"></div>

          <button id="backToDept" class="w-full mt-2 py-2 rounded-xl border border-gray-200 text-text-sub text-sm hover:text-primary transition">← 重新选科室</button>`;
        renderDateRow();
        renderSlotTable();
        document.getElementById('nextToForm').addEventListener('click', () => { apptStep = 2; renderApptStep2(); });
        document.getElementById('backToDept').addEventListener('click', () => { apptStep = 0; renderApptStep0(); });
      }

      function renderDateRow() {
        const row = document.getElementById('dateRow');
        row.innerHTML = apptSchedule.dates.map(d => {
          const day = new Date(d + 'T00:00:00');
          const label = (d === apptSchedule.dates[0] ? '今天' : '') + (['周日', '周一', '周二', '周三', '周四', '周五', '周六'][day.getDay()]) + ' ' + d.slice(5);
          const active = d === apptPickDate;
          return `<button data-date="${d}" class="date-chip text-[11px] px-2.5 py-1.5 rounded-lg border shrink-0 transition ${active ? 'bg-primary text-white border-primary' : 'border-gray-200 text-text-sub hover:border-primary hover:text-primary'}">${label}</button>`;
        }).join('');
        row.querySelectorAll('.date-chip').forEach(b => b.addEventListener('click', () => {
          apptPickDate = b.dataset.date;
          apptPick = null;
          renderDateRow(); renderSlotTable();
          document.getElementById('pickHint').textContent = '未选择';
          document.getElementById('nextToForm').disabled = true;
        }));
      }

      function renderSlotTable() {
        const table = document.getElementById('slotTable');
        const doctors = apptSchedule.doctors;
        table.innerHTML = `
          <table class="w-full text-xs border-collapse min-w-[420px]">
            <thead><tr class="bg-gray-50">
              <th class="px-2 py-2 text-left font-medium text-text-sub border border-gray-100">时段</th>
              ${doctors.map(d => `<th class="px-2 py-2 font-medium text-text-sub border border-gray-100">${escapeHtml(d.name)}<br/><span class="text-[10px] font-normal">${escapeHtml(d.title)}</span></th>`).join('')}
            </tr></thead>
            <tbody>
              ${apptSchedule.time_slots.map(slot => `
                <tr>
                  <td class="px-2 py-2 text-text-sub border border-gray-100 whitespace-nowrap">${escapeHtml(slot)}</td>
                  ${doctors.map(d => {
                    const remaining = apptSchedule.slots[apptPickDate][slot][d.name];
                    const picked = apptPick && apptPick.date === apptPickDate && apptPick.slot === slot && apptPick.doctor === d.name;
                    return `<td class="p-1 border border-gray-100 text-center">
                      ${remaining > 0
                        ? `<button data-slot="${slot}" data-doctor="${d.name}" class="slot-btn w-full py-1.5 rounded-lg transition ${picked ? 'bg-primary text-white' : 'bg-primary-light/50 text-primary hover:bg-primary-light'}">余${remaining}</button>`
                        : `<span class="text-text-sub/40">已满</span>`}
                    </td>`;
                  }).join('')}
                </tr>`).join('')}
            </tbody>
          </table>`;
        table.querySelectorAll('.slot-btn').forEach(b => b.addEventListener('click', () => {
          apptPick = { date: apptPickDate, slot: b.dataset.slot, doctor: b.dataset.doctor };
          renderSlotTable();
          document.getElementById('pickHint').textContent = `${apptPick.date} ${apptPick.slot} · ${apptPick.doctor}`;
          document.getElementById('nextToForm').disabled = false;
        }));
      }

      function renderApptStep2() {
        messageContainer.innerHTML = serviceShell(apptHeaderHtml() + `
          <div class="space-y-3">
            <p class="text-xs bg-primary-light/60 rounded-xl px-3 py-2 text-text-sub">已选：${escapeHtml(apptHospital.name)} · ${escapeHtml(apptDep)} · ${escapeHtml(apptPick.doctor)} · ${apptPick.date} ${escapeHtml(apptPick.slot)}</p>
            <div>
              <label class="block text-xs text-text-sub mb-1">就诊人姓名 *</label>
              <input id="fName" maxlength="30" placeholder="与身份证一致" class="w-full px-3 py-2 rounded-xl border border-gray-200 focus:border-primary outline-none text-sm" />

            <div>
              <label class="block text-xs text-text-sub mb-1">手机号 *</label>
              <input id="fPhone" maxlength="20" placeholder="用于接收就诊提醒" class="w-full px-3 py-2 rounded-xl border border-gray-200 focus:border-primary outline-none text-sm" />
            </div>
            <div>
              <label class="block text-xs text-text-sub mb-1">病情描述（选填）</label>
              <textarea id="fSymptom" rows="3" maxlength="500" placeholder="简单描述症状，方便医生提前了解" class="w-full px-3 py-2 rounded-xl border border-gray-200 focus:border-primary outline-none text-sm resize-none"></textarea>
            </div>
            <button id="submitAppt" class="w-full py-2.5 rounded-xl bg-primary text-white text-sm font-medium shadow-md shadow-primary/25 transition disabled:opacity-60">确认挂号</button>
            <button id="backToSlot" class="w-full py-2 rounded-xl border border-gray-200 text-text-sub text-sm hover:text-primary transition">← 重新选时段</button>
          </div>`);
        bindApptHeader();
        document.getElementById('submitAppt').addEventListener('click', submitAppointment);
        document.getElementById('backToSlot').addEventListener('click', () => { apptStep = 1; renderApptStep1(); });
      }

      async function submitAppointment() {
        if (!token) { alert('请先登录后再预约挂号'); window.location.replace('login.html'); return; }
        const name = document.getElementById('fName').value.trim();
        const phone = document.getElementById('fPhone').value.trim();
        const symptom = document.getElementById('fSymptom').value.trim();
        if (name.length < 2) { alert('请填写就诊人姓名'); return; }
        if (phone.length < 7) { alert('请填写正确的手机号'); return; }
        const btn = document.getElementById('submitAppt');
        btn.disabled = true; btn.textContent = '提交中…';
        const res = await apiFetch('/api/appointments', {
          method: 'POST',
          body: JSON.stringify({
            hospital_id: apptHospital.id, department: apptDep, doctor: apptPick.doctor,
            visit_date: apptPick.date, time_slot: apptPick.slot,
            patient_name: name, patient_phone: phone, symptom,
          }),
        });
        btn.disabled = false; btn.textContent = '确认挂号';
        if (!res.ok) { alert('挂号失败：' + ((res.data && res.data.detail) || '请稍后重试')); return; }
        apptStep = 3;
        renderApptStep3(res.data);
      }

      function renderApptStep3(data) {
        const t = data.ticket;
        messageContainer.innerHTML = serviceShell(apptHeaderHtml() + `
          <div class="text-center py-2">
            <div class="w-14 h-14 rounded-full bg-success/10 text-success flex items-center justify-center mx-auto text-2xl mb-3">✓</div>
            <h4 class="font-semibold text-lg">挂号成功</h4>
            <p class="text-xs text-text-sub mt-1">预约号 <span class="text-primary font-semibold">${data.appointment_id}</span>（演示系统，无真实号源）</p>
          </div>
          <div class="mt-4 rounded-xl border border-dashed border-gray-300 p-4 space-y-1.5 text-sm">
            <p><span class="font-medium">${escapeHtml(t.hospital_name)}</span></p>
            <p class="text-xs text-text-sub">${escapeHtml(t.hospital_address)}</p>
            <p>${escapeHtml(t.department)} · ${escapeHtml(t.doctor)}</p>
            <p>${t.visit_date} ${escapeHtml(t.time_slot)}</p>
            <p>就诊人：${escapeHtml(t.patient_name)}</p>
          </div>
          <div class="flex gap-2 mt-4">
            <button id="viewMyAppt" class="flex-1 py-2.5 rounded-xl bg-primary text-white text-sm font-medium">查看我的预约</button>
            <button id="bookAgain" class="flex-1 py-2.5 rounded-xl border border-gray-200 text-text-sub text-sm">继续挂号</button>
          </div>`);
        bindApptHeader();
        document.getElementById('viewMyAppt').addEventListener('click', () => { apptView = 'list'; renderApptList(); });
        document.getElementById('bookAgain').addEventListener('click', () => { apptStep = 0; renderApptStep0(); });
      }

      async function renderApptList() {
        messageContainer.innerHTML = serviceShell(apptHeaderHtml() + `<div id="listBody"><p class="text-sm text-text-sub text-center py-8">加载中…</p></div>`);
        bindApptHeader();
        const body = document.getElementById('listBody');
        if (!token) {
          body.innerHTML = '<p class="text-sm text-center py-8">请先<a href="login.html" class="text-primary underline">登录</a>后查看预约</p>';
          return;
        }
        const res = await apiFetch('/api/appointments');
        if (res.status === 401) {
          body.innerHTML = '<p class="text-sm text-center py-8">登录已过期，请重新<a href="login.html" class="text-primary underline">登录</a></p>';
          return;
        }
        const items = res.ok ? (res.data.appointments || []) : [];
        if (!items.length) { body.innerHTML = '<p class="text-sm text-text-sub text-center py-8">暂无预约记录</p>'; return; }
        body.outerHTML = `<div class="space-y-2">${items.map(a => `
          <div class="rounded-xl border ${a.status === 'active' ? 'border-gray-200' : 'border-gray-100 opacity-60'} px-4 py-3 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <p class="text-sm font-medium truncate">${escapeHtml(a.hospital_name)} · ${escapeHtml(a.department)}</p>
              <p class="text-[11px] text-text-sub mt-0.5">${escapeHtml(a.doctor)} · ${a.visit_date} ${escapeHtml(a.time_slot)} · ${escapeHtml(a.patient_name)}</p>
            </div>
            ${a.status === 'active'
              ? `<button data-aid="${a.id}" class="cancel-btn shrink-0 text-xs px-3 py-1.5 rounded-lg border border-gray-200 text-text-sub hover:text-danger hover:border-danger transition">取消</button>`
              : '<span class="shrink-0 text-[10px] px-2 py-1 rounded-full bg-gray-100 text-text-sub">已取消</span>'}
          </div>`).join('')}</div>`;
        messageContainer.querySelectorAll('.cancel-btn').forEach(b => b.addEventListener('click', async () => {
          if (!confirm('确定取消该预约吗？')) return;
          const r = await apiFetch('/api/appointments/' + b.dataset.aid, { method: 'DELETE' });
          if (r.ok) renderApptList();
          else alert('取消失败：' + ((r.data && r.data.detail) || ''));
        }));
      }

      // ================== 服务二：附近医院（真实定位） ==================
      let hospitalCity = '', hospitalDistrict = '';
      let hospitalLat = null, hospitalLng = null; // 浏览器真实定位（开启后按真实距离排序）
      function renderHospitalPanel() {
        messageContainer.innerHTML = serviceShell(`
          <div class="flex items-center justify-between mb-3 gap-2">
            <h3 class="text-base font-semibold flex items-center gap-2">${ICONS.pin.replace('width="18"', 'width="20"').replace('height="18"', 'height="20"')}附近医院</h3>
            <button id="locateBtn" class="text-xs px-3 py-1.5 rounded-full border border-gray-200 text-text-sub hover:text-primary hover:border-primary transition">
              ${hospitalLat != null ? '已定位 · 重新定位' : '定位 · 离我最近'}
            </button>
          </div>
          <div id="locateHint" class="hidden text-[11px] rounded-xl px-3 py-2 mb-2"></div>
          <div id="cityRow" class="flex gap-1.5 overflow-x-auto custom-scroll pb-2 mb-2"></div>
          <div id="districtRow" class="flex gap-1.5 overflow-x-auto custom-scroll pb-2 mb-3"></div>
          <div id="hospitalList"><p class="text-sm text-text-sub text-center py-6">加载中…</p></div>
          <p class="text-[11px] text-text-sub mt-3 text-center">* 医院为演示数据；定位后按经纬度计算真实直线距离并排序</p>`);
        const cities = ['', '杭州', '北京', '上海', '深圳'];
        document.getElementById('cityRow').innerHTML = cities.map(c =>
          `<button data-city="${c}" class="city-chip text-xs px-3 py-1.5 rounded-full border transition shrink-0 ${hospitalCity === c ? 'bg-primary text-white border-primary' : 'border-gray-200 text-text-sub hover:border-primary hover:text-primary'}">${c || '全部'}</button>`
        ).join('');
        document.getElementById('cityRow').querySelectorAll('.city-chip').forEach(b => b.addEventListener('click', () => {
          hospitalCity = b.dataset.city; hospitalDistrict = '';
          renderHospitalPanel();
        }));
        document.getElementById('locateBtn').addEventListener('click', doLocate);
        renderLocateHint();
        loadHospitalList();
      }

      function doLocate() {
        const btn = document.getElementById('locateBtn');
        if (!navigator.geolocation) {
          alert('当前浏览器不支持定位，请使用较新的 Chrome / Edge');
          return;
        }
        btn.disabled = true; btn.textContent = '定位中…';
        navigator.geolocation.getCurrentPosition(
          pos => {
            hospitalLat = pos.coords.latitude;
            hospitalLng = pos.coords.longitude;
            btn.disabled = false; btn.textContent = '已定位 · 重新定位';
            renderLocateHint();
            loadHospitalList();
          },
          err => {
            btn.disabled = false; btn.textContent = '定位 · 离我最近';
            const hint = document.getElementById('locateHint');
            hint.classList.remove('hidden');
            hint.className = 'text-[11px] rounded-xl px-3 py-2 mb-2 bg-orange-50 text-text-main border border-orange-200';
            hint.textContent = '定位失败：' + (err.code === 1 ? '您拒绝了定位权限，可通过城市筛选浏览（localhost 本地访问不需要地图 Key）' : '暂时无法获取位置，请稍后重试');
          },
          { timeout: 8000, maximumAge: 60000 }
        );
      }
      function renderLocateHint() {
        const hint = document.getElementById('locateHint');
        if (!hint) return;
        if (hospitalLat != null) {
          hint.classList.remove('hidden');
          hint.className = 'text-[11px] rounded-xl px-3 py-2 mb-2 bg-primary-light/60 text-text-main border border-primary/20';
          hint.textContent = `已定位（${hospitalLat.toFixed(4)}, ${hospitalLng.toFixed(4)}）：距离为按经纬度计算的真实直线距离，已按"离我最近"排序`;
        } else {
          hint.classList.add('hidden');
        }
      }

      async function loadHospitalList() {
        const params = new URLSearchParams();
        if (hospitalCity) params.set('city', hospitalCity);
        if (hospitalDistrict) params.set('district', hospitalDistrict);
        if (hospitalLat != null) { params.set('lat', hospitalLat); params.set('lng', hospitalLng); }
        const res = await apiFetch('/api/hospitals?' + params.toString());
        const hospitals = res.ok ? (res.data.hospitals || []) : [];
        const districtRow = document.getElementById('districtRow');
        const list = document.getElementById('hospitalList');
        if (!districtRow || !list) return;
        const districts = res.ok ? (res.data.districts || []) : [];
        if (hospitalCity && districts.length) {
          districtRow.innerHTML = ['', ...districts].map(d =>
            `<button data-district="${d}" class="d-chip text-xs px-3 py-1.5 rounded-full border transition shrink-0 ${hospitalDistrict === d ? 'bg-primary text-white border-primary' : 'border-gray-200 text-text-sub hover:border-primary hover:text-primary'}">${d || '全区'}</button>`
          ).join('');
          districtRow.querySelectorAll('.d-chip').forEach(b => b.addEventListener('click', () => {
            hospitalDistrict = b.dataset.district;
            renderHospitalPanel();
          }));
        } else {
          districtRow.innerHTML = '';
        }
        if (!hospitals.length) {
          list.innerHTML = '<p class="text-sm text-text-sub text-center py-6">该筛选条件下暂无医院（请确认 MySQL 已启用）</p>';
          return;
        }
        const located = hospitalLat != null;
        const distLabel = d => located
          ? (d < 10 ? d + ' km' : '约 ' + Math.round(d) + ' km') + '<span class="text-[10px] text-text-sub/70">（直线）</span>'
          : '约 ' + d + ' km<span class="text-[10px] text-text-sub/70">（参考）</span>';
        list.innerHTML = `<div class="space-y-2">${hospitals.map((h, i) => `
          <div class="rounded-xl border border-gray-200 px-4 py-3">
            <div class="flex items-start justify-between gap-2">
              <p class="text-sm font-medium">${i === 0 && located ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-primary text-white align-middle mr-1.5">最近</span>' : ''}${escapeHtml(h.name)}</p>
              <span class="shrink-0 text-[10px] px-2 py-0.5 rounded-full ${h.level === '三甲' ? 'bg-primary-light text-primary' : 'bg-gray-100 text-text-sub'}">${escapeHtml(h.level)}</span>
            </div>
            <p class="text-[11px] text-text-sub mt-1">${escapeHtml(h.address)}</p>
            <div class="flex flex-wrap items-center gap-2 mt-1.5">
              <span class="text-[11px] text-text-sub">${escapeHtml(h.phone)}</span>
              <span class="text-[11px] text-warning">★ ${h.rating}</span>
              <span class="text-[11px] text-text-main font-medium">距您 ${distLabel(h.distance_km)}</span>
            </div>
            <div class="flex flex-wrap gap-1 mt-1.5">${h.departments.slice(0, 7).map(d => `<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-50 text-text-sub border border-gray-100">${escapeHtml(d)}</span>`).join('')}</div>
          </div>`).join('')}</div>`;
      }
      // ================== 服务三：图片问诊 ==================
      let visionFile = null;
      function renderVisionPanel() {
        messageContainer.innerHTML = serviceShell(`
          <h3 class="text-base font-semibold mb-1 flex items-center gap-2">${ICONS.camera.replace('width="18"', 'width="20"').replace('height="18"', 'height="20"')}图片问诊（皮肤科）</h3>
          <p class="text-xs text-text-sub mb-3">上传皮损、皮疹、色素斑等照片，视觉大模型给出初步识别与护理建议。</p>
          <div id="dropZone" class="rounded-2xl border-2 border-dashed border-gray-200 hover:border-primary transition cursor-pointer py-10 text-center">
            <p class="text-primary mb-2">${ICONS.camera.replace('width="18"', 'width="28"').replace('height="18"', 'height="28"')}</p>
            <p class="text-sm text-text-main">点击或拖拽上传图片</p>
            <p class="text-[11px] text-text-sub mt-1">支持 jpg / png / webp，不超过 8MB</p>
            <input type="file" id="visionInput" accept="image/*" class="hidden" />
          </div>
          <div id="visionPreview" class="hidden mt-3">
            <img id="visionImg" class="max-h-56 mx-auto rounded-xl border border-gray-100" alt="预览" />
          </div>
          <button id="analyzeBtn" disabled class="w-full mt-3 py-2.5 rounded-xl bg-primary text-white text-sm font-medium shadow-md shadow-primary/25 transition disabled:opacity-40">开始识别</button>
          <div id="visionResult" class="mt-3"></div>
          <p class="text-[11px] text-text-sub mt-3">识别结果仅供健康参考，不构成医疗诊断，请及时到皮肤科面诊。</p>`);
        const dz = document.getElementById('dropZone');
        const fi = document.getElementById('visionInput');
        dz.addEventListener('click', () => fi.click());
        dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('border-primary'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('border-primary'));
        dz.addEventListener('drop', e => {
          e.preventDefault(); dz.classList.remove('border-primary');
          if (e.dataTransfer.files.length) setVisionFile(e.dataTransfer.files[0]);
        });
        fi.addEventListener('change', () => { if (fi.files.length) setVisionFile(fi.files[0]); });
        document.getElementById('analyzeBtn').addEventListener('click', doVisionAnalyze);
      }

      function setVisionFile(file) {
        if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
        if (file.size > 8 * 1024 * 1024) { alert('图片不能超过 8MB'); return; }
        visionFile = file;
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('visionImg').src = e.target.result;
          document.getElementById('visionPreview').classList.remove('hidden');
          document.getElementById('analyzeBtn').disabled = false;
          document.getElementById('visionResult').innerHTML = '';
        };
        reader.readAsDataURL(file);
      }

      async function doVisionAnalyze() {
        if (!visionFile) return;
        const btn = document.getElementById('analyzeBtn');
        const result = document.getElementById('visionResult');
        btn.disabled = true; btn.textContent = '识别中（约 10-30 秒）…';
        result.innerHTML = '<p class="text-sm text-text-sub text-center py-6">视觉模型分析中…</p>';
        const fd = new FormData();
        fd.append('file', visionFile);

      function setReportFile(file) {
        if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }

        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('reportImg').src = e.target.result;
          document.getElementById('reportPreview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }

      async function doReportAnalyze() {

        btn.disabled = false; btn.textContent = '重新解读';
        if (res.status === 503) {
          result.innerHTML = `<div class="rounded-xl bg-orange-50 border border-orange-200 p-4 text-xs leading-relaxed text-text-main">

          apiFetch('/api/medications/checklist/today'),

      function scheduleMedNotifications(items) {
        if (medsTimer) { clearInterval(medsTimer); medsTimer = null; }
        if (!items.length || !('Notification' in window)) return;
        if (Notification.permission === 'default') Notification.requestPermission();
        medsTimer = setInterval(() => {
          if (Notification.permission !== 'granted') return;
          const now = new Date();
          const hm = pad(now.getHours()) + ':' + pad(now.getMinutes());
          const today = now.toISOString().slice(0, 10);
          items.forEach(it => {
            if (it.taken) return;
            const key = today + '|' + it.medication_id + '|' + it.time_point;
            if (it.time_point === hm && !medsNotified[key]) {

              new Notification('用药提醒', { body: `该服用「${it.medicine_name}」了（${it.time_point}）` });

          });
        }, 30000);

          </div>

          <p class="text-[11px] text-text-sub mt-3">* 数值仅供参考，异常请咨询医生；收缩压/舒张压建议分开查看趋势。</p>`);
        document.getElementById('trendMetric').addEventListener('change', e => {

      async function loadTrendRecords() {
        const res = await apiFetch(`/api/health/records?record_type=${trendMetric}&days=${trendDays}`);
        const chart = document.getElementById('trendChart');

        if (res.status === 401) {
          messageContainer.innerHTML = serviceShell('<p class="text-sm text-center py-8">登录已过期，请重新<a href="login.html" class="text-primary underline">登录</a></p>');

          chart.style.opacity = 0.4;

          renderTrendTiles(trendCache[trendMetric]);
          return;
        }
        const records = res.data.records || [];
        trendCache[trendMetric] = records;

        drawTrendChart(records);

      function renderTrendTiles(records) {
        const box = document.getElementById('trendTiles');
        if (!box) return;
        const m = TREND_METRICS[trendMetric];
        const latest = records && records.length ? records[records.length - 1] : null;
        const values = records ? records.map(r => r.value) : [];
        const hi = values.length ? Math.max(...values) : null;
        const lo = values.length ? Math.min(...values) : null;
        // stat tile 规范：label（句首小写无冒号）· value（Sans 半粗）· delta/说明（次级）
        const tile = (label, valueHtml, sub) => `
          <div class="bg-white rounded-xl border border-gray-100 px-3 py-2 text-center">
            <p class="text-[10px] text-text-sub">${label}</p>
            <p class="text-lg font-semibold tabular-nums mt-0.5">${valueHtml}</p>
            <p class="text-[10px] text-text-sub/80 mt-0.5">${sub}</p>
          </div>`;
        box.innerHTML =
          tile('最新值',
            latest ? latest.value.toFixed(m.digits) + ' <span class="text-[10px] font-normal text-text-sub">' + m.unit + '</span>' : '—',
            latest ? latest.record_date.slice(5) : '暂无记录') +
          tile('区间最高',
            hi != null ? hi.toFixed(m.digits) + ' <span class="text-[10px] font-normal text-text-sub">' + m.unit + '</span>' : '—',
            hi != null && lo != null ? '最低 ' + lo.toFixed(m.digits) : '暂无记录') +
          tile('记录条数', values.length, '近 ' + trendDays + ' 天');
      }

      // ---------- 单序列折线图（数据可视化规范：细线、8px 标记点、十字光标 + 工具提示、隐性网格） ----------
      function niceStep(range, targetTicks) {
        const raw = range / targetTicks;
        const mag = Math.pow(10, Math.floor(Math.log10(raw)));
        const norm = raw / mag;
        const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
        return step * mag;
      }
      function drawTrendChart(records) {
        const svg = document.getElementById('trendChart');
        const wrap = document.getElementById('trendChartWrap');
        const tooltip = document.getElementById('trendTooltip');
        const title = document.getElementById('trendChartTitle');
        if (!svg || !wrap) return;
        const m = TREND_METRICS[trendMetric];
        title.textContent = `${m.label}（${m.unit}）· 近 ${trendDays} 天`;
        const NS = 'http://www.w3.org/2000/svg';
        const mk = (tag, attrs) => {
          const el = document.createElementNS(NS, tag);
          Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
          return el;
        };
        const W = 600, H = 240, P = { l: 46, r: 18, t: 14, b: 30 };
        const iw = W - P.l - P.r, ih = H - P.t - P.b;
        svg.innerHTML = '';
        svg.style.opacity = 1;

        if (!records.length) {
          svg.appendChild(mk('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--muted)' }))
            .textContent = '暂无记录，先在上方记录一条数据';
          return;
        }
        // 数值范围：落在指标合理区间内，向外取整（y 轴刻度为干净数字）
        let lo = Math.min(...records.map(r => r.value));
        let hi = Math.max(...records.map(r => r.value));
        if (lo === hi) { lo -= m.step; hi += m.step; }
        lo = Math.max(m.min, Math.floor(lo / m.step) * m.step);
        hi = Math.min(m.max, Math.ceil(hi / m.step) * m.step);
        if (lo >= hi) { lo = m.min; hi = Math.max(hi, lo + m.step); }
        const n = records.length;
        const x = i => P.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
        const y = v => P.t + ih * (1 - (v - lo) / (hi - lo));

        // 网格线（hairline，比基线更浅）+ y 轴刻度（干净数字）
        const ticks = Math.max(3, Math.min(6, Math.round((hi - lo) / m.step) + 1));
        const stepV = (hi - lo) / (ticks - 1);
        for (let i = 0; i < ticks; i++) {
          const v = lo + stepV * i;
          const py = y(v);
          svg.appendChild(mk('line', { x1: P.l, y1: py, x2: W - P.r, y2: py, stroke: 'var(--grid-line)', 'stroke-width': 1 }));
          const t = mk('text', { x: P.l - 8, y: py + 3.5, 'text-anchor': 'end', 'font-size': 10, fill: 'var(--muted)' });
          t.textContent = Number.isInteger(v) ? String(v) : v.toFixed(1);
          svg.appendChild(t);
        }
        // 基线（x 轴）
        svg.appendChild(mk('line', { x1: P.l, y1: y(lo), x2: W - P.r, y2: y(lo), stroke: 'var(--axis)', 'stroke-width': 1 }));

        // x 轴日期标签（最多 5 个，不重叠）
        const labelIdx = n <= 5 ? records.map((_, i) => i) : [0, Math.floor((n - 1) / 4), Math.floor((n - 1) / 2), Math.floor(3 * (n - 1) / 4), n - 1].filter((v, i, a) => a.indexOf(v) === i);
        labelIdx.forEach(i => {
          const t = mk('text', { x: x(i), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle', 'font-size': 10, fill: 'var(--muted)' });
          t.textContent = records[i].record_date.slice(5);
          svg.appendChild(t);
        });

        // 折线（2px，圆角端点）
        const linePath = records.map((r, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r.value).toFixed(1)).join('');
        svg.appendChild(mk('path', { d: linePath, fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));

        // 数据点标记（r=4 填充系列色 + 2px 表面色描边；命中区域放大到 24px 便于悬停）
        records.forEach((r, i) => {
          const px = x(i), py = y(r.value);
          const hit = mk('circle', { cx: px, cy: py, r: 12, fill: 'transparent' });
          hit.dataset.idx = i;
          hit.style.cursor = 'crosshair';
          svg.appendChild(hit);
          svg.appendChild(mk('circle', { cx: px, cy: py, r: 4, fill: 'var(--series-1)', stroke: 'var(--ring)', 'stroke-width': 2 }));
        });

        // 直接标注：只标最后一个点（值在端点），文字用文本色而非系列色
        const last = records[n - 1];
        const lx = Math.min(x(n - 1) + 8, W - P.r - 34);
        const lt = mk('text', { x: lx, y: y(last.value) + 3.5, 'font-size': 11, fill: 'var(--text-secondary)', 'font-weight': 600 });
        lt.textContent = String(last.value.toFixed(m.digits));
        svg.appendChild(lt);

        // 十字光标：垂直参考线吸附最近数据点 + 统一工具提示
        let cross = null;
        const showTip = idx => {
          const r = records[idx];
          const px = x(idx), py = y(r.value);
          if (!cross) {
            cross = mk('line', { y1: P.t, y2: P.t + ih, stroke: 'var(--series-1)', 'stroke-width': 1, 'stroke-opacity': 0.45 });
            svg.appendChild(cross);
          }
          cross.setAttribute('x1', px); cross.setAttribute('x2', px);
          // 工具提示：数值在前（强调），日期/备注在后（次级）
          tooltip.innerHTML = '';
          const strong = document.createElement('p');
          strong.style.cssText = 'font-size:13px;font-weight:600;color:var(--text-primary);font-variant-numeric:tabular-nums;';
          strong.textContent = r.value.toFixed(m.digits) + ' ' + m.unit;
          const sub = document.createElement('p');
          sub.style.cssText = 'font-size:11px;color:var(--text-secondary);margin-top:1px;';
          sub.textContent = r.record_date + (r.note ? ' · ' + r.note : '');
          tooltip.appendChild(strong);
          tooltip.appendChild(sub);
          tooltip.classList.remove('hidden');
          const rect = wrap.getBoundingClientRect();
          const chartRect = svg.getBoundingClientRect();
          tooltip.style.left = ((px / W) * chartRect.width) + 'px';
          tooltip.style.top = ((py / H) * chartRect.height - 8) + 'px';
        };
        svg.addEventListener('mousemove', e => {
          const rect = svg.getBoundingClientRect();
          const sx = ((e.clientX - rect.left) / rect.width) * W;
          // 吸附最近的数据点（十字光标负责定位 X）
          let best = 0, bd = Infinity;
          records.forEach((_, i) => { const d = Math.abs(x(i) - sx); if (d < bd) { bd = d; best = i; } });
          showTip(best);
        });
        svg.addEventListener('mouseleave', () => {
          if (cross) cross.remove(); cross = null;
          tooltip.classList.add('hidden');
        });
        // 键盘可达：每个命中圆可聚焦并显示同一工具提示
        svg.querySelectorAll('circle[data-idx]').forEach(c => {
          c.setAttribute('tabindex', 0);
          c.addEventListener('focus', () => showTip(parseInt(c.dataset.idx, 10)));
          c.addEventListener('blur', () => { tooltip.classList.add('hidden'); if (cross) { cross.remove(); cross = null; } });
        });
      }

      function renderTrendTable(records) {
        const box = document.getElementById('trendTable');
        if (!box) return;
        if (!records.length) {
          box.innerHTML = '<p class="text-xs text-text-sub text-center py-3">暂无记录</p>';
          return;
        }
        const m = TREND_METRICS[trendMetric];
        box.innerHTML = `<div class="overflow-x-auto"><table class="w-full text-xs border-collapse min-w-[320px]">
          <thead><tr class="bg-gray-50">
            <th class="px-2.5 py-2 text-left font-medium text-text-sub border border-gray-100">日期</th>

      // ================== 服务八：常见问题 FAQ ==================

      // ================== 会话管理 ==================
      const bottomBar = document.getElementById('bottomBar');

      function createSession(mode) {

      function updateSendState() {

      // ================== 流式气泡（打字动画） ==================
      function createStreamBubble(mode) {

        return {

      // ================== 会诊过程面板（实时） ==================
      function newAgentPanel() {
        return {
          flow: 'consultation',
          reason: '',
          stages: {},          // key → 'done'（plan/inquiry/rag/specialty/answer）
          parallel: { symptom: 'pending', rag: 'pending', risk: 'pending' },
          risk: null,
          ragDetail: '',
          ragChunks: 0,
        };
      }
      function parallelDone(p) {
        return p.parallel.symptom === 'done' && p.parallel.rag === 'done' && p.parallel.risk === 'done';
      }
      // 阶段状态推导：完成 → 执行中（第一个未完成）→ 等待中
      function liveStatus(p, key) {
        const order = p.flow === 'knowledge'
          ? ['plan', 'rag', 'answer']
          : ['plan', 'inquiry', 'parallel', 'specialty', 'answer'];
        const own = key === 'parallel' ? (parallelDone(p) ? 'done' : null) : (p.stages[key] || null);
        if (own === 'done') return 'done';
        for (const k of order) {
          const done = k === 'parallel' ? parallelDone(p) : p.stages[k] === 'done';
          if (!done) return k === key ? 'running' : 'pending';
        }
        return 'done';
      }
      function liveProcessCard(p) {
        const isKnowledge = p.flow === 'knowledge';
        const seq = isKnowledge ? ['plan', 'rag', 'answer'] : ['plan', 'inquiry', 'parallel', 'specialty', 'answer'];
        const icon = st => st === 'done'
          ? '<span class="w-5 h-5 rounded-full bg-success/10 text-success flex items-center justify-center text-[11px] shrink-0">✓</span>'
          : st === 'running'
            ? '<span class="w-5 h-5 rounded-full bg-primary/15 flex items-center justify-center shrink-0 stage-running"><span class="w-2 h-2 rounded-full bg-primary"></span></span>'
            : '<span class="w-5 h-5 rounded-full bg-gray-100 text-text-sub/40 flex items-center justify-center text-[11px] shrink-0">·</span>';
        const txt = st => st === 'done' ? '<span class="text-[10px] text-success">完成</span>'
          : st === 'running' ? '<span class="text-[10px] text-primary">执行中…</span>'
          : '<span class="text-[10px] text-text-sub/50">等待中</span>';
        const stageRow = key => {
          if (key === 'parallel') {
            const parSt = liveStatus(p, 'parallel');
            const subs = ['symptom', 'rag', 'risk'].map(k => {
              const st = p.parallel[k] === 'done' ? 'done' : parSt === 'running' ? 'running' : 'pending';
              return `
                <div class="flex-1 min-w-0 bg-white rounded-lg border border-gray-100 px-2.5 py-2">
                  <p class="text-[10px] text-text-sub text-center truncate">${AGENT_META[k].label}</p>
                  <p class="text-[10px] text-center mt-0.5 font-medium ${st === 'done' ? 'text-success' : st === 'running' ? 'text-primary' : 'text-text-sub/50'}">${st === 'done' ? '✓ 完成' : st === 'running' ? '执行中…' : '等待中'}</p>
                </div>`;
            }).join('');
            return `<div class="flex gap-2 mt-2">${subs}</div>`;
          }
          const st = liveStatus(p, key);
          return `
            <div class="flex items-center gap-2.5 ${key === 'plan' ? '' : 'mt-2'}">
              ${icon(st)}
              <span class="text-xs font-medium ${st === 'done' ? 'text-text-main' : st === 'running' ? 'text-primary' : 'text-text-sub/60'}">${AGENT_META[key].label}</span>
              ${txt(st)}
            </div>`;
        };
        const riskBadge = p.risk && p.risk.level
          ? `<span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${p.risk.level === '高风险' ? 'bg-red-50 text-danger' : p.risk.level === '中风险' ? 'bg-orange-50 text-warning' : 'bg-green-50 text-success'}">${escapeHtml(p.risk.level)}</span>`
          : '';
        const ragDetail = p.ragDetail
          ? `<details class="mt-2 text-[11px] text-text-sub"><summary class="cursor-pointer select-none hover:text-primary transition">查看知识库检索详情（${p.ragChunks} 条）</summary><pre class="whitespace-pre-wrap mt-1.5 bg-gray-50 rounded-lg p-2 max-h-48 overflow-y-auto custom-scroll text-text-sub leading-relaxed">${escapeHtml(p.ragDetail)}</pre></details>`
          : '';
        return `
          <div class="bg-white/70 border border-primary-light/70 rounded-2xl px-4 py-3 mb-2">
            <div class="flex items-center justify-between gap-2">
              <p class="text-xs font-semibold text-primary">会诊过程${isKnowledge ? '（知识问答捷径）' : '（完整流程）'}</p>
              ${riskBadge}
            </div>
            <p class="text-[11px] text-text-sub mt-1.5 leading-relaxed">${escapeHtml(p.reason || 'Supervisor 正在规划会诊流程…')}</p>
            <div class="mt-2 border-t border-gray-100 pt-2">
              ${seq.map(stageRow).join('')}
            </div>
            ${ragDetail}
          </div>`;
      }
      function renderLiveProcess(container, p) { container.innerHTML = liveProcessCard(p); }
      // 收尾时把实时状态快照成历史消息可回放的结构（与 processCardHtml 对齐）
      function snapshotPanel(p) {
        const isKnowledge = p.flow === 'knowledge';
        const order = isKnowledge ? ['plan', 'rag', 'answer'] : ['plan', 'inquiry', 'parallel', 'specialty', 'answer'];
        return {
          flow: p.flow,
          reason: p.reason,
          stages: order.filter(k => k !== 'parallel')
            .map(k => ({ key: k, status: p.stages[k] === 'done' ? 'done' : 'pending' })),
          parallel: ['symptom', 'rag', 'risk'].map(k => ({ key: k, status: p.parallel[k] })),
          risk: p.risk,
          ragDetail: p.ragDetail,
          ragChunks: p.ragChunks,
        };
      }

      // ================== SSE 通用解析 ==================
      async function consumeSSE(resp, onEvent) {
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n')) >= 0) {
            const line = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 1);
            if (!line.startsWith('data:')) continue;
            const payload = line.slice(5).trim();
            if (payload === '[DONE]') return;
            try { onEvent(JSON.parse(payload)); } catch (e) { /* 忽略非法行 */ }
          }
        }
      }
      // 组装后端历史：仅 user/assistant 文本消息，问诊追问按 assistant 传递
      function buildHistory(session) {
        return (session.messages || [])
          .filter(m => m.role === 'user' || (m.role === 'assistant' && !m.results))
          .map(m => ({ role: m.isQuestion ? 'assistant' : m.role, content: m.content }))
          .filter(m => m.content)
          .slice(-20);
      }
      function authHeaders(extra) {
        const headers = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return headers;
      }

      // ================== 发送：按模式分流 ==================
      async function sendMessage() {
        const text = input.value.trim();
        if (!text || isTyping) return;
        input.value = '';
        autoResize(input);
        ensureSession();
        const session = sessions.find(s => s.id === currentId);
        if (!session) return;
        // 知识库检索：查询与结果成对落盘，由 doSearch 统一处理
        if (currentMode === MODE.SEARCH) { await doSearch(session, text); return; }
        session.messages.push({ role: 'user', content: text, time: Date.now() });
        session.updatedAt = Date.now();
        sortSessions();
        saveSessions();
        renderMessages();
        scrollToBottom();
        const history = buildHistory(session);
        if (currentMode === MODE.CHAT) await streamChat(session, text, history);
        else if (currentMode === MODE.AGENT) await streamAgent(session, text, history, document.getElementById('profileChk').checked);
      }

      // ---------- 智能问答（/api/chat SSE） ----------
      async function streamChat(session, text, history) {
        isTyping = true;
        updateSendState();
        const bubble = createStreamBubble(MODE.CHAT);
        messageContainer.appendChild(bubble.wrap);
        scrollToBottom();
        let resp;
        try {
          resp = await fetch(API_BASE + '/api/chat', {
            method: 'POST', headers: authHeaders(),
            body: JSON.stringify({ message: text, history }),
          });
        } catch (e) {
          bubble.showError('无法连接服务器，请确认后端服务已启动');
          isTyping = false; updateSendState();
          return;
        }
        if (!resp.ok || !resp.body) {
          let detail = '服务暂时不可用，请稍后重试';
          try { const d = await resp.json(); if (d && typeof d.detail === 'string') detail = d.detail; } catch (e) {}
          bubble.showError(detail);
          isTyping = false; updateSendState();
          return;
        }
        let content = '';
        await consumeSSE(resp, ev => {
          if (ev.content) { content += ev.content; bubble.setContent(content); }
          else if (ev.error) bubble.showError(ev.error);
        });
        if (content) {
          session.messages.push({ role: 'assistant', mode: MODE.CHAT, content, time: Date.now() });
          session.updatedAt = Date.now();
          sortSessions();
          saveSessions();
          renderMessages();
        }
        // 出错时保留气泡展示错误信息（下次渲染自然消失）
        isTyping = false;
        updateSendState();
      }

      // ---------- 多智能体会诊（/api/agent/chat SSE：plan/agent/question/content/done） ----------
      async function streamAgent(session, text, history, includeProfile) {
        isTyping = true;
        updateSendState();
        const bubble = createStreamBubble(MODE.AGENT);
        const panelEl = document.createElement('div');
        messageContainer.appendChild(panelEl);
        messageContainer.appendChild(bubble.wrap);
        scrollToBottom();
        const p = newAgentPanel();
        renderLiveProcess(panelEl, p);

        let resp;
        try {
          resp = await fetch(API_BASE + '/api/agent/chat', {
            method: 'POST', headers: authHeaders(),
            body: JSON.stringify({ message: text, history, include_profile: includeProfile }),
          });
        } catch (e) {
          bubble.showError('无法连接服务器，请确认后端服务已启动');
          isTyping = false; updateSendState();
          return;
        }
        if (!resp.ok || !resp.body) {
          let detail = '服务暂时不可用，请稍后重试';
          try { const d = await resp.json(); if (d && typeof d.detail === 'string') detail = d.detail; } catch (e) {}
          bubble.showError(detail);
          isTyping = false; updateSendState();
          return;
        }

        let content = '';
        let askedQuestion = false;
        const meta = { sources: [], risk_level: null };
        await consumeSSE(resp, ev => {
          const data = ev.data;
          switch (ev.type) {
            case 'plan':
              p.flow = data && data.next_agent === 'rag' ? 'knowledge' : 'consultation';
              p.reason = (data && data.reason) || '';
              p.stages.plan = 'done';
              renderLiveProcess(panelEl, p);
              break;
            case 'agent': {
              const name = data && data.name;
              if (name === 'inquiry') p.stages.inquiry = 'done';
              else if (name === 'specialty') p.stages.specialty = 'done';
              else if (name === 'rag') {
                p.stages.rag = 'done';
                p.parallel.rag = 'done';
                p.ragDetail = (data && data.result) || '';
                p.ragChunks = p.ragDetail ? (p.ragDetail.match(/\[\d+\]/g) || []).length : 0;
              }
              else if (name === 'symptom') p.parallel.symptom = 'done';
              else if (name === 'risk') {
                p.parallel.risk = 'done';
                try { p.risk = typeof data.result === 'string' ? JSON.parse(data.result) : data.result; } catch (e) {}
              }
              renderLiveProcess(panelEl, p);
              break;
            }
            case 'question': {
              askedQuestion = true;
              const q = data || '可以再详细描述一下你的症状吗？';
              session.messages.push({ role: 'assistant', isQuestion: true, content: q, time: Date.now() });
              session.updatedAt = Date.now();
              sortSessions();
              saveSessions();
              renderMessages(); // 追问气泡取代流式占位（占位节点随之脱离文档，后续 remove 为无害空操作）
              break;
            }
            case 'content':
              if (!content) renderLiveProcess(panelEl, p); // 回答阶段开始
              content += data || '';
              bubble.setContent(content);
              break;
            case 'done':
              if (data && data.risk_level) meta.risk_level = data.risk_level;
              if (data && data.sources) meta.sources = data.sources || [];
              break;
            case 'error':
              bubble.showError(data || '服务暂时不可用，请稍后重试');
              break;
          }
        });

        if (askedQuestion) {
          // 追问轮：消息已落盘并渲染，只需清理占位
          bubble.remove();
          panelEl.remove();
        } else if (content) {
          p.stages.answer = 'done';
          session.messages.push({
            role: 'assistant', mode: MODE.AGENT, content, time: Date.now(),
            process: snapshotPanel(p),
            sources: meta.sources.map(s => sourceLabel(s)),
            risk_level: meta.risk_level,
          });
          session.updatedAt = Date.now();
          sortSessions();
          saveSessions();
          renderMessages();
        }
        // 无内容且无追问（出错/空回答）：保留气泡显示错误信息
        isTyping = false;
        updateSendState();
      }

      // ---------- 知识库检索（/api/knowledge/search） ----------
      async function doSearch(session, query) {
        isTyping = true;
        updateSendState();
        session.messages.push({ role: 'user', content: query, time: Date.now() });
        session.updatedAt = Date.now();
        sortSessions();
        saveSessions();
        renderMessages();
        scrollToBottom();
        const bubble = createStreamBubble(MODE.SEARCH);
        messageContainer.appendChild(bubble.wrap);
        scrollToBottom();
        const res = await apiFetch('/api/knowledge/search', {
          method: 'POST',
          body: JSON.stringify({ query, top_k: 8, top_n: 5 }),
        });
        bubble.remove();
        session.messages.push({
          role: 'assistant', mode: MODE.SEARCH, content: '', time: Date.now(),
          results: res.ok && res.data.items ? res.data.items : null,
          error: res.ok ? null : ((res.data && res.data.detail) || '检索失败，请稍后重试'),
        });
        session.updatedAt = Date.now();
        sortSessions();
        saveSessions();
        renderMessages();
        isTyping = false;
        updateSendState();
      }
      function searchResultBubble(m) {
        if (m.error) {
          return `
            <div class="flex justify-start gap-2.5">
              <div class="w-8 h-8 rounded-xl bg-primary-light text-primary flex items-center justify-center shrink-0 mt-1">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </div>
              <div class="max-w-[85%] sm:max-w-[75%]">
                <div class="bg-white rounded-2xl rounded-tl-md shadow-sm border border-gray-100 px-4 py-3">
                  <p class="text-[11px] font-medium text-primary mb-1">知识库检索</p>
                  <p class="text-sm text-danger">${escapeHtml(m.error)}</p>
                  <p class="text-[10px] text-text-sub text-right mt-1.5">${formatTime(m.time)}</p>
                </div>
              </div>
            </div>`;
        }
        const items = m.results || [];
        const rows = items.length ? items.map((it, i) => `
          <div class="rounded-xl border border-gray-100 bg-gray-50/70 p-3 mb-2 last:mb-0">
            <p class="text-[11px] font-medium text-text-sub mb-1">片段 ${i + 1}</p>
            <p class="text-[13px] leading-relaxed text-text-main">${renderInlineMd(it.content || '')}</p>
            <p class="text-[10px] text-text-sub mt-1.5">来源：${escapeHtml(sourceLabel(it))}${typeof it.score === 'number' ? ' · 相关度 ' + it.score.toFixed(3) : ''}</p>
          </div>`).join('')
          : '<p class="text-xs text-text-sub text-center py-2">未检索到相关内容，换个关键词试试</p>';
        return `
          <div class="flex justify-start gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-primary-light text-primary flex items-center justify-center shrink-0 mt-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </div>
            <div class="max-w-[85%] sm:max-w-[75%]">
              <div class="bg-white rounded-2xl rounded-tl-md shadow-sm border border-gray-100 px-4 py-3">
                <div class="flex items-center justify-between mb-1.5 gap-2">
                  <p class="text-[11px] font-medium text-primary">知识库检索</p>
                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-text-sub font-medium">${items.length} 条结果</span>
                </div>
                ${rows}
                <p class="text-[10px] text-text-sub text-right mt-1.5">${formatTime(m.time)}</p>
              </div>
            </div>
          </div>`;
      }

      // ================== 输入交互 ==================
      function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 140) + 'px';
      }
      input.addEventListener('input', () => autoResize(input));
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
      });
      sendBtn.addEventListener('click', sendMessage);
      // 快捷提问 chip：首页/服务面板跳转到智能问答，咨询模式直接发送
      messageContainer.addEventListener('click', e => {
        const chip = e.target.closest('[data-chip]');
        if (!chip || isTyping) return;
        input.value = chip.textContent.trim();
        if (SERVICE_MODES.includes(currentMode)) switchMode(MODE.CHAT);
        sendMessage();
      });

      // ================== 认证 UI ==================
      const userAvatar = document.getElementById('userAvatar');
      const userNameEl = document.getElementById('userName');
      const logoutBtnEl = document.getElementById('logoutBtn');
      userAvatar.style.cursor = 'pointer';
      userNameEl.style.cursor = 'pointer';
      function setUserUI(name) {
        displayName = name;
        if (name) {
          userAvatar.textContent = name.slice(0, 1).toUpperCase();
          userNameEl.textContent = name;
          logoutBtnEl.classList.remove('hidden');
        } else {
          userAvatar.textContent = '医';
          userNameEl.textContent = '未登录';
          logoutBtnEl.classList.add('hidden');
        }
      }
      async function initAuth() {
        if (!token) { setUserUI(null); }
        else {
          const r = await apiFetch('/api/auth/me');
          setUserUI(r.ok && r.data.username ? r.data.username : null);
        }
        // 登录态校准后刷新首页欢迎语（访客 → 用户名）
        if (currentMode === MODE.HOME) renderHome();
      }
      // 右上角用户区：跳转独立账号页（用户信息 / 资料 / 设置 / 改密）
      const goUserPage = () => { location.href = 'user.html'; };
      userAvatar.addEventListener('click', goUserPage);
      userNameEl.addEventListener('click', goUserPage);
      logoutBtnEl.addEventListener('click', async () => {
        if (token) { try { await apiFetch('/api/auth/logout', { method: 'POST' }); } catch (e) {} }
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        location.href = 'login.html';
      });

      // ================== 初始化 ==================
      loadSessions();
      currentId = sessions.length ? sessions[0].id : null;
      renderSidebar();
      // 支持从独立功能页跳转回来：?mode=chat 等直接进入对应功能
      const urlMode = new URLSearchParams(location.search).get('mode');
      const startMode = Object.values(MODE).includes(urlMode) ? urlMode : MODE.HOME;
      switchMode(startMode);
      initAuth();
    })();
  </script>
</body>
</html>
