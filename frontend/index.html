<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>多智能体协同 RAG 医疗咨询助手</title>

  <!-- CDN 引入 Tailwind CSS v3（无需本地依赖） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',        // 主色：柔和科技蓝
            'primary-dark': '#0E42D2',
            'primary-light': '#E8F3FF',// 辅助浅蓝
            'text-main': '#1D2129',
            'text-sub': '#6E7681',
            danger: '#F53F3F',
            success: '#00B42A',
            warning: '#FF7D00'
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    }
    /* 移动端视口高度：100dvh 避免键盘弹出遮挡输入框，100vh 兜底兼容旧浏览器 */
    .app-height { height: 100vh; height: 100dvh; }

    /* 滚动条美化 */
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #D3DAE6; border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #B8C2D0; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }

    /* AI 打字加载动画（三个点跳动） */
    @keyframes typingBlink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    .typing-dot { animation: typingBlink 1.2s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    /* 会诊阶段：执行中呼吸灯 */
    @keyframes stagePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(22, 93, 255, 0.35); }
      50% { box-shadow: 0 0 0 5px rgba(22, 93, 255, 0.08); }
    }
    .stage-running { animation: stagePulse 1.2s ease-in-out infinite; }

    /* 检索结果内容多行截断 */
    .line-clamp-4 {
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }
  </style>
</head>

<body class="app-height bg-[#F7F9FC] text-text-main antialiased overflow-hidden flex flex-col">
  <!-- ==================== 顶部导航栏 ==================== -->
  <header class="h-16 shrink-0 bg-white/90 backdrop-blur border-b border-gray-100 flex items-center px-3 sm:px-5 gap-2 z-20">
    <!-- 手机端汉堡按钮（展开历史侧边栏） -->
    <button id="menuBtn" class="md:hidden p-2 rounded-lg text-text-main hover:bg-primary-light transition" aria-label="打开历史会话">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Logo + 应用名 -->
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center text-white shadow-md shadow-primary/25 shrink-0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>
      <div class="leading-tight min-w-0">
        <p class="font-semibold text-[15px] truncate">多智能体协同 RAG 医疗咨询助手</p>
        <p class="text-[11px] text-text-sub truncate">AI 健康科普 · 在线咨询</p>
      </div>
    </div>

    <div class="flex-1"></div>

    <!-- 右上角用户区 -->
    <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
      <div class="flex items-center gap-2">
        <div id="userAvatar" class="w-9 h-9 rounded-full bg-primary-light text-primary font-semibold flex items-center justify-center">医</div>
        <span id="userName" class="hidden sm:block text-sm font-medium text-text-main max-w-[120px] truncate">用户</span>
      </div>
      <button id="logoutBtn" class="text-sm px-2.5 sm:px-3 py-1.5 rounded-lg text-text-sub hover:text-danger hover:bg-red-50 transition flex items-center gap-1.5" title="退出登录">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
        </svg>
        <span id="logoutLabel" class="hidden sm:inline">退出</span>
      </button>
    </div>
  </header>

  <!-- ==================== 功能模式切换条（两行：咨询 / 服务） ==================== -->
  <nav class="shrink-0 bg-white border-b border-gray-100 px-3 sm:px-5">
    <!-- 第一行：AI 咨询 -->
    <div class="max-w-3xl mx-auto flex gap-1.5 pt-2">
      <button id="tabChat" data-mode="chat"
        class="flex-1 sm:flex-none sm:px-6 py-2 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1.5 bg-primary text-white shadow-md shadow-primary/25">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="hidden xs:inline sm:inline">智能问答</span>
        <span class="sm:hidden">问答</span>
      </button>
      <button id="tabAgent" data-mode="agent"
        class="flex-1 sm:flex-none sm:px-6 py-2 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1.5 text-text-sub hover:bg-gray-50">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        多智能体会诊
      </button>
      <button id="tabSearch" data-mode="search"
        class="flex-1 sm:flex-none sm:px-6 py-2 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1.5 text-text-sub hover:bg-gray-50">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        知识库检索
      </button>
    </div>
    <!-- 第二行：医疗服务 -->
    <div class="max-w-3xl mx-auto flex gap-1.5 py-2">
      <button id="tabAppt" data-mode="appt"
        class="flex-1 sm:flex-none sm:px-5 py-2 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1.5 text-text-sub hover:bg-gray-50">
        <span>🏥</span>预约挂号
      </button>
      <button id="tabHospital" data-mode="hospital"
        class="flex-1 sm:flex-none sm:px-5 py-2 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1.5 text-text-sub hover:bg-gray-50">
        <span>📍</span>附近医院
      </button>
      <button id="tabVision" data-mode="vision"
        class="flex-1 sm:flex-none sm:px-5 py-2 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1.5 text-text-sub hover:bg-gray-50">
        <span>📷</span>图片问诊
      </button>
      <button id="tabProfile" data-mode="profile"
        class="flex-1 sm:flex-none sm:px-5 py-2 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1.5 text-text-sub hover:bg-gray-50">
        <span>👤</span>健康档案
      </button>
    </div>
  </nav>

  <!-- ==================== 主体区域 ==================== -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- 手机端遮罩层（点击空白关闭侧边栏） -->
    <div id="overlay" class="fixed inset-0 bg-black/40 z-30 hidden md:hidden"></div>

    <!-- ① 左侧历史会话侧边栏（PC 永久展开 / 手机抽屉） -->
    <aside id="sidebar"
      class="fixed md:static inset-y-0 left-0 z-40 w-[280px] md:w-72 bg-white border-r border-gray-100 flex flex-col shrink-0 transition-transform duration-300 -translate-x-full md:translate-x-0">
      <div class="p-4 border-b border-gray-100">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-[15px] flex items-center gap-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v18M3 12h18"/>
            </svg>
            历史会话
          </h2>
          <!-- 手机端关闭按钮 -->
          <button id="closeSidebarBtn" class="md:hidden p-2 rounded-lg text-text-sub hover:bg-gray-100 transition" aria-label="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <!-- 新建会话按钮 -->
        <button id="newChatBtn"
          class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-primary hover:bg-primary-dark active:scale-[0.98] text-white text-sm font-medium shadow-md shadow-primary/20 transition">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          新建会话
        </button>
        <!-- 清空全部历史 -->
        <button id="clearAllBtn" class="w-full mt-2 text-xs text-text-sub hover:text-danger transition py-1.5 rounded-lg hover:bg-red-50">
          清空全部历史
        </button>
      </div>

      <!-- 会话列表 -->
      <div id="sessionList" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-1.5"></div>
    </aside>

    <!-- ② 中间聊天主体 -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#F7F9FC]">

      <!-- 消息滚动区 -->
      <div id="messageArea" class="flex-1 overflow-y-auto custom-scroll px-4 py-6">
        <div id="messageContainer" class="max-w-3xl mx-auto space-y-5"></div>
      </div>

      <!-- 底部输入区 -->
      <div class="shrink-0 bg-white border-t border-gray-100" style="padding-bottom: env(safe-area-inset-bottom);">
        <div class="max-w-3xl mx-auto px-3 sm:px-4 pt-3 pb-2">
          <!-- 模式提示行 + 会诊携带健康档案开关 -->
          <div class="flex items-center justify-between mb-2 px-1 gap-2">
            <p id="modeHint" class="text-[11px] text-text-sub truncate"></p>
            <label id="profileToggle" class="hidden shrink-0 text-[11px] text-text-sub cursor-pointer select-none flex items-center gap-1" title="会诊时把您的健康档案（病史/过敏史等）一并提供给大模型">
              <input type="checkbox" id="profileChk" class="accent-primary" />
              携带健康档案会诊
            </label>
          </div>
          <div id="inputBar" class="flex items-end gap-2 bg-[#FAFCFF] rounded-2xl border border-gray-200 focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 p-2 transition">
            <!-- 多行自适应输入框 -->
            <textarea id="input" rows="1" maxlength="2000" placeholder="请输入您的健康问题，如：最近总是头痛怎么办？"
              class="flex-1 resize-none bg-transparent outline-none text-sm text-text-main placeholder:text-text-sub/70 leading-relaxed py-2 px-2 max-h-[140px]"></textarea>
            <!-- 发送按钮 -->
            <button id="sendBtn" class="shrink-0 w-10 h-10 rounded-xl bg-primary hover:bg-primary-dark active:scale-95 text-white flex items-center justify-center shadow-md shadow-primary/25 transition" title="发送" aria-label="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/>
              </svg>
            </button>
          </div>
          <!-- 永久固定安全提示 -->
          <p class="text-center text-[11px] text-text-sub mt-2 leading-relaxed">
            ⚠️ AI医疗助手仅提供健康科普参考，不构成医疗诊断，如有身体不适，请及时前往医院就诊。
          </p>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      // ================== 常量与鉴权 ==================
      const TOKEN_KEY = 'rag_med_token';
      const USER_KEY  = 'rag_med_username';
      const AI_DISCLAIMER = '本AI仅供健康参考，不能替代执业医师诊断，身体不适请及时线下就医';

      // 前端由 FastAPI 同源托管，API 走相对路径
      const API_BASE = '';

      const token = localStorage.getItem(TOKEN_KEY);
      const username = localStorage.getItem(USER_KEY);

      // 会话按 token 隔离存储（同一账号多设备共享；访客用 guest 隔离）
      const STORE_KEY = 'rag_med_sessions_' + (token || 'guest');

      // ================== 功能模式（咨询 3 种 + 服务 4 种） ==================
      const MODE = {
        CHAT: 'chat', AGENT: 'agent', SEARCH: 'search',
        APPT: 'appt', HOSPITAL: 'hospital', VISION: 'vision', PROFILE: 'profile',
      };
      let currentMode = MODE.CHAT;

      const SERVICE_MODES = [MODE.APPT, MODE.HOSPITAL, MODE.VISION, MODE.PROFILE];

      const MODE_META = {
        [MODE.CHAT]: {
          hint: '⚡ 智能问答：大模型直接快速回答日常健康问题（无多智能体流程）',
          placeholder: '请输入您的健康问题，如：最近总是头痛怎么办？',
        },
        [MODE.AGENT]: {
          hint: '🩺 多智能体会诊：Supervisor 组织 问诊→症状/RAG/风险并行分析→专科→综合回答 全流程',
          placeholder: '请描述您的症状，如：我最近总是头晕，持续三天了…',
        },
        [MODE.SEARCH]: {
          hint: '📚 知识库检索：直接检索《内科学》《外科学》（第10版）教材知识库',
          placeholder: '输入医学关键词，如：高血压的饮食注意事项',
        },
        [MODE.APPT]: {
          hint: '🏥 预约挂号：选择科室 → 医院排班 → 填写就诊人，生成挂号单（演示系统，无真实号源）',
          placeholder: '',
        },
        [MODE.HOSPITAL]: {
          hint: '📍 附近医院：按城市/区查询医院列表（内置演示数据，含模拟距离）',
          placeholder: '',
        },
        [MODE.VISION]: {
          hint: '📷 图片问诊：上传皮损/皮肤照片，视觉大模型识别并给出护理与就医建议',
          placeholder: '',
        },
        [MODE.PROFILE]: {
          hint: '👤 健康档案：填写病史/过敏史，多智能体会诊时自动携带（仅自己可见）',
          placeholder: '',
        },
      };

      // 会诊各 Agent 展示信息
      const AGENT_META = {
        plan:      { label: '流程规划',   icon: '🧭' },
        inquiry:   { label: '问诊分析',   icon: '🩺' },
        symptom:   { label: '症状分析',   icon: '🔬' },
        rag:       { label: '知识检索 RAG', icon: '📚' },
        risk:      { label: '风险评估',   icon: '🛡️' },
        specialty: { label: '专科分析',   icon: '🏥' },
        answer:    { label: '生成回答',   icon: '💬' },
      };

      let sessions = [];     // 全部会话
      let currentId = null;  // 当前会话 id
      let isTyping = false;  // AI 是否在生成中

      // ================== 工具函数 ==================
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }
      // 极简 Markdown：先转义再渲染 **加粗**，保证安全
      function renderInlineMd(text) {
        return escapeHtml(text).replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold">$1</strong>');
      }
      function pad(n) { return String(n).padStart(2, '0'); }
      function formatTime(ts) {
        const d = new Date(ts), now = new Date();
        const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
        if (d.toDateString() === now.toDateString()) return hm;
        if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm;
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + pad(d.getDate());
      }
      function sessionTitle(s) {
        const first = (s.messages || []).find(m => m.role === 'user');
        const title = first ? first.content : '新的会话';
        return title.length > 18 ? title.slice(0, 18) + '…' : title;
      }
      function sortSessions() { sessions.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); }
      function sourceLabel(s) {
        const name = String(s.source || '').split('/').pop();
        return name + (s.page ? ' 第' + s.page + '页' : '');
      }

      // ================== 本地存储读写 ==================
      function loadSessions() {
        try { sessions = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
        catch (e) { sessions = []; }
      }
      function saveSessions() {
        localStorage.setItem(STORE_KEY, JSON.stringify(sessions));
      }

      // ================== DOM 引用 ==================
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const sessionList = document.getElementById('sessionList');
      const messageContainer = document.getElementById('messageContainer');
      const messageArea = document.getElementById('messageArea');
      const input = document.getElementById('input');
      const modeHint = document.getElementById('modeHint');

      // ================== 侧边栏（移动端抽屉） ==================
      function openSidebar() { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
      function closeSidebar() { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
      document.getElementById('menuBtn').addEventListener('click', openSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
      overlay.addEventListener('click', closeSidebar);

      // ================== 渲染：侧边栏 ==================
      function renderSidebar() {
        if (!sessions.length) {
          sessionList.innerHTML = '<div class="text-center text-text-sub text-xs py-10 px-4 leading-relaxed">暂无历史会话<br/>点击"新建会话"开始咨询</div>';
          return;
        }
        sessionList.innerHTML = sessions.map(s => {
          const active = s.id === currentId;
          return `
            <div class="group session-item rounded-xl px-3 py-2.5 cursor-pointer transition flex items-center gap-2 ${active ? 'bg-primary-light/70' : 'hover:bg-gray-50'}" data-id="${s.id}">
              <div class="flex-1 min-w-0" data-action="switch">
                <p class="text-sm font-medium truncate ${active ? 'text-primary' : 'text-text-main'}">${escapeHtml(sessionTitle(s))}</p>
                <p class="text-[11px] text-text-sub mt-0.5">${formatTime(s.updatedAt)}</p>
              </div>
              <button class="shrink-0 p-1.5 rounded-lg text-text-sub hover:text-danger hover:bg-red-50 transition md:opacity-0 md:group-hover:opacity-100" data-action="delete" title="删除该会话" aria-label="删除会话">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            </div>`;
        }).join('');
      }

      // ================== 渲染：消息气泡 ==================
      function userBubble(m) {
        return `
          <div class="flex justify-end">
            <div class="max-w-[80%] sm:max-w-[70%] bg-primary text-white rounded-2xl rounded-tr-md px-4 py-3 shadow-md shadow-primary/15">
              <p class="text-sm leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(m.content)}</p>
              <p class="text-[10px] text-white/60 text-right mt-1">${formatTime(m.time)}</p>
            </div>
          </div>`;
      }
      function aiBubble(m) {
        // 模式徽章：让普通问答与会诊回答一眼可辨
        const badge = m.mode === MODE.AGENT
          ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-primary text-white font-medium">🩺 会诊报告</span>'
          : '<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-text-sub font-medium">⚡ 快速问答</span>';
        const sourcesHtml = (m.sources && m.sources.length)

      // 会诊追问气泡（医生形象）
      function doctorQuestionBubble(m) {
        return `
          <div class="flex justify-start gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 text-danger flex items-center justify-center shrink-0 mt-1">

      }
      // 会诊过程面板（历史消息回放：全部阶段已完成）
      function processCardHtml(p) {
        const flow = p.flow || 'consultation';
        const isKnowledge = flow === 'knowledge';
        const seq = isKnowledge ? ['plan', 'rag', 'answer'] : ['plan', 'inquiry', 'parallel', 'specialty', 'answer'];
        const stageHtml = key => {
          if (key === 'parallel') {
            const subs = (p.parallel || []).map(s => `
              <div class="flex-1 min-w-0 bg-white rounded-lg border border-gray-100 px-2.5 py-2">
                <p class="text-[10px] text-text-sub text-center truncate">${AGENT_META[s.key] ? AGENT_META[s.key].icon : ''} ${AGENT_META[s.key] ? AGENT_META[s.key].label : s.key}</p>
                <p class="text-[10px] text-center mt-0.5 font-medium ${s.status === 'done' ? 'text-success' : 'text-text-sub/50'}">
                  ${s.status === 'done' ? '✓ 完成' + (s.elapsed ? ' ' + s.elapsed : '') : '未进行'}
                </p>
              </div>`).join('');
            return `
              <div class="flex gap-2 mt-2">
                ${subs}
              </div>`;
          }
          const stage = (p.stages || []).find(x => x.key === key);
          if (!stage) return '';
          return `
            <div class="flex items-center gap-2.5 ${key === 'plan' ? '' : 'mt-2'}">
              <span class="w-5 h-5 rounded-full flex items-center justify-center text-[11px] shrink-0 ${stage.status === 'done' ? 'bg-success/10 text-success' : 'bg-gray-100 text-text-sub/50'}">${stage.status === 'done' ? '✓' : '·'}</span>
              <span class="text-xs font-medium ${stage.status === 'done' ? 'text-text-main' : 'text-text-sub/60'}">${AGENT_META[key].icon} ${AGENT_META[key].label}</span>
              <span class="text-[10px] ${stage.status === 'done' ? 'text-success' : 'text-text-sub/50'}">${stage.status === 'done' ? '完成' + (stage.elapsed ? ' · ' + stage.elapsed : '') : '未进行'}</span>
            </div>`;
        };
        const ragDetail = p.ragDetail
          ? `<details class="mt-2 text-[11px] text-text-sub"><summary class="cursor-pointer select-none hover:text-primary transition">📚 查看知识库检索详情（${p.ragChunks || 0} 条）</summary><pre class="whitespace-pre-wrap mt-1.5 bg-gray-50 rounded-lg p-2 max-h-48 overflow-y-auto custom-scroll text-text-sub leading-relaxed">${escapeHtml(p.ragDetail)}</pre></details>`
          : '';
        const riskBadge = p.risk && p.risk.level
          ? `<span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${p.risk.level === '高风险' ? 'bg-red-50 text-danger' : p.risk.level === '中风险' ? 'bg-orange-50 text-warning' : 'bg-green-50 text-success'}">🛡️ ${p.risk.level}</span>`
          : '';
        return `
          <div class="bg-white/70 border border-primary-light/70 rounded-2xl px-4 py-3 mb-2">
            <div class="flex items-center justify-between gap-2">
              <p class="text-xs font-semibold text-primary">🩺 会诊过程${isKnowledge ? '（知识问答捷径）' : '（完整流程）'}</p>
              ${riskBadge}
            </div>
            <p class="text-[11px] text-text-sub mt-1.5 leading-relaxed">🧭 ${escapeHtml(p.reason || 'Supervisor 已完成流程规划')}</p>
            <div class="mt-2 border-t border-gray-100 pt-2">
              ${seq.map(stageHtml).join('')}
            </div>
            ${ragDetail}
          </div>`;
      }
      function emptyState() {
        const chips = ['最近总是失眠怎么办', '高血压平时要注意什么', '感冒咳嗽怎么护理', '体检报告怎么看'];
        return `
          <div class="flex flex-col items-center justify-center text-center py-14 px-4">
            <div class="w-16 h-16 rounded-2xl bg-primary-light flex items-center justify-center text-primary mb-4">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-text-main">你好，我是 AI 医疗助手</h3>

            <div class="flex flex-wrap justify-center gap-2 mt-6">
              ${chips.map(c => `<button data-chip class="text-xs sm:text-sm px-4 py-2 rounded-full bg-white border border-gray-200 text-text-sub hover:text-primary hover:border-primary hover:bg-primary-light/40 transition">${c}</button>`).join('')}
            </div>

      function agentEmptyState() {
        return `
          <div class="flex flex-col items-center justify-center text-center py-10 px-4">
            <div class="w-16 h-16 rounded-2xl bg-primary-light flex items-center justify-center text-primary mb-4">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-text-main">🩺 多智能体会诊</h3>
            <p class="text-sm text-text-sub mt-2 max-w-md leading-relaxed">与普通问答不同，这里由 Supervisor 组织 6 个 Agent 协作：问诊 Agent 会追问病情细节，然后并行执行症状分析、RAG 知识检索、风险评估，再由专科 Agent 匹配方向，最终生成结构化会诊报告。</p>
            <div class="w-full max-w-md mt-5 bg-white rounded-2xl border border-gray-100 p-4 text-left space-y-2">
              <p class="text-xs text-text-sub">🧭 Supervisor：规划流程 → 🩺 问诊：多轮追问收集病情</p>
              <p class="text-xs text-text-sub">⚡ 并行分析：🔬症状 + 📚RAG检索 + 🛡️风险评估</p>
              <p class="text-xs text-text-sub">🏥 专科匹配 → 💬 综合会诊报告（含风险提示与文献来源）</p>
            </div>
            <div class="flex flex-wrap justify-center gap-2 mt-6">
              ${['我最近总是头晕，持续三天', '肚子疼了两天，吃什么药', '最近总是咳嗽，晚上加重'].map(c => `<button data-chip class="text-xs sm:text-sm px-4 py-2 rounded-full bg-white border border-gray-200 text-text-sub hover:text-primary hover:border-primary hover:bg-primary-light/40 transition">${c}</button>`).join('')}
            </div>
          </div>`;
      }
      function searchEmptyState() {
        const chips = ['高血压的饮食注意事项', '糖尿病的诊断标准', '肺炎的症状和治疗', '胃溃疡的病因'];
        return `
          <div class="flex flex-col items-center justify-center text-center py-10 px-4">
            <div class="w-16 h-16 rounded-2xl bg-primary-light flex items-center justify-center text-primary mb-4">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-text-main">📚 知识库检索</h3>
            <p class="text-sm text-text-sub mt-2 max-w-md leading-relaxed">直接检索医疗教材知识库（《内科学》《外科学》第10版，8398 个知识片段）：向量召回 + 重排精排，返回最相关的原文片段及精确页码。</p>
            <div class="flex flex-wrap justify-center gap-2 mt-6">
              ${chips.map(c => `<button data-chip class="text-xs sm:text-sm px-4 py-2 rounded-full bg-white border border-gray-200 text-text-sub hover:text-primary hover:border-primary hover:bg-primary-light/40 transition">${c}</button>`).join('')}
            </div>
          </div>`;
      }
      function renderMessages() {
        if (SERVICE_MODES.includes(currentMode)) { renderServicePanel(); return; }
        if (currentMode === MODE.SEARCH) { messageContainer.innerHTML = searchEmptyState(); return; }
        const session = sessions.find(s => s.id === currentId);
        if (!session || !session.messages.length) {
          messageContainer.innerHTML = currentMode === MODE.AGENT ? agentEmptyState() : emptyState();
          return;
        }
        messageContainer.innerHTML = session.messages.map(m => {
          if (m.role === 'user') return userBubble(m);
          if (m.isQuestion) return doctorQuestionBubble(m);
          // 会诊消息：先渲染过程面板，再渲染回答气泡
          return (m.process ? processCardHtml(m.process) : '') + aiBubble(m);
        }).join('');
        scrollToBottom();
      }
      function scrollToBottom() {
        requestAnimationFrame(() => { messageArea.scrollTop = messageArea.scrollHeight; });
      }

      // ================== 服务面板：通用 ==================
      async function apiFetch(path, options) {
        const opts = options || {};
        const headers = Object.assign({}, opts.headers || {});
        if (token) headers['Authorization'] = 'Bearer ' + token;
        if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
        let resp;
        try {
          resp = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
        } catch (e) {
          return { ok: false, status: 0, data: { detail: '无法连接服务器，请确认后端服务已启动' } };
        }
        let data = null;
        try { data = await resp.json(); } catch (e) { data = {}; }
        return { ok: resp.ok, status: resp.status, data };
      }
      function serviceShell(inner) {
        return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 sm:p-6">${inner}</div>`;
      }
      function renderServicePanel() {
        const m = currentMode;
        if (m === MODE.APPT) renderAppointmentPanel();
        else if (m === MODE.HOSPITAL) renderHospitalPanel();
        else if (m === MODE.VISION) renderVisionPanel();
        else if (m === MODE.PROFILE) renderProfilePanel();
      }

      // ================== 服务一：预约挂号 ==================
      const APPT_DEPARTMENTS = ['皮肤科', '内科', '外科', '儿科', '妇产科', '骨科', '眼科', '口腔科', '耳鼻喉科', '中医科'];
      let apptView = 'book';      // book | list
      let apptStep = 0;           // 0 选科室 1 选时段 2 填信息 3 挂号单
      let apptDep = null, apptHospital = null, apptSchedule = null, apptPick = null, apptPickDate = null;

      function apptHeaderHtml() {
        const steps = ['选科室', '选时段', '填信息', '挂号单'];
        return `
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-base font-semibold">🏥 预约挂号</h3>
            <button id="apptToggleView" class="text-xs px-3 py-1.5 rounded-full border border-gray-200 text-text-sub hover:text-primary hover:border-primary transition">
              ${apptView === 'book' ? '我的预约 →' : '← 返回挂号'}
            </button>
          </div>
          <div class="flex items-center gap-1 mb-4">
            ${steps.map((s, i) => {
              const state = i < apptStep ? 'done' : i === apptStep ? 'cur' : 'todo';
              const cls = state === 'done' ? 'bg-success/10 text-success border-success/30'
                : state === 'cur' ? 'bg-primary text-white border-primary'
                : 'bg-white text-text-sub/60 border-gray-200';
              return `<span class="flex-1 text-center text-[11px] py-1.5 rounded-lg border ${cls}">${state === 'done' ? '✓ ' : ''}${i + 1}. ${s}</span>`;
            }).join('')}
          </div>`;
      }
      function bindApptHeader() {
        const btn = document.getElementById('apptToggleView');
        if (btn) btn.addEventListener('click', () => {
          if (apptView === 'book') { apptView = 'list'; renderApptList(); }
          else { apptView = 'book'; apptStep = 0; renderApptStep0(); }
        });
      }
      function renderAppointmentPanel() {
        if (apptView === 'list') { renderApptList(); return; }
        if (apptStep === 0) renderApptStep0();
        else if (apptStep === 1) renderApptStep1();
        else if (apptStep === 2) renderApptStep2();
      }

      function renderApptStep0() {
        messageContainer.innerHTML = serviceShell(apptHeaderHtml() + `
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
            ${APPT_DEPARTMENTS.map(d => `<button data-dept="${d}" class="dept-btn py-3 rounded-xl border border-gray-200 text-sm font-medium text-text-main hover:border-primary hover:text-primary hover:bg-primary-light/40 transition">${d}</button>`).join('')}
          </div>
          <p class="text-[11px] text-text-sub mt-3">* 演示系统：排班为模拟数据，请勿实际前往医院</p>`);
        bindApptHeader();
        messageContainer.querySelectorAll('.dept-btn').forEach(b => b.addEventListener('click', () => {
          apptDep = b.dataset.dept; apptStep = 1;
          apptHospital = null; apptSchedule = null; apptPick = null; apptPickDate = null;
          renderApptStep1();
        }));
      }

      async function renderApptStep1() {
        messageContainer.innerHTML = serviceShell(apptHeaderHtml() + `<div id="apptStep1Body"><p class="text-sm text-text-sub text-center py-8">正在加载医院列表…</p></div>`);
        bindApptHeader();
        const body = document.getElementById('apptStep1Body');
        const res = await apiFetch('/api/hospitals?department=' + encodeURIComponent(apptDep));
        if (!body) return;
        const hospitals = res.ok ? (res.data.hospitals || []) : [];
        if (!hospitals.length) {
          body.innerHTML = '<p class="text-sm text-text-sub text-center py-8">暂无可预约医院（请确认 MySQL 已启用）</p>';
          return;
        }
        body.innerHTML = `
          <p class="text-xs text-text-sub mb-2">选择就诊医院（${escapeHtml(apptDep)}）：</p>
          <div class="space-y-2">${hospitals.map(h => `
            <button data-hid="${h.id}" class="hosp-btn w-full text-left flex items-center justify-between gap-2 rounded-xl border border-gray-200 px-4 py-3 hover:border-primary hover:bg-primary-light/30 transition">
              <span class="min-w-0">
                <span class="block text-sm font-medium truncate">${escapeHtml(h.name)}</span>
                <span class="block text-[11px] text-text-sub mt-0.5">${escapeHtml(h.level)} · ${escapeHtml(h.city)}${escapeHtml(h.district)} · 距您约 ${h.distance_km}km</span>
              </span>
              <span class="text-[11px] text-warning shrink-0">★ ${h.rating}</span>
            </button>`).join('')}</div>`;
        body.querySelectorAll('.hosp-btn').forEach(b => b.addEventListener('click', () => {
          apptHospital = hospitals.find(h => String(h.id) === b.dataset.hid);
          renderSchedulePicker();
        }));
      }

      async function renderSchedulePicker() {
        const body = document.getElementById('apptStep1Body');
        if (!body) return;
        body.innerHTML = '<p class="text-sm text-text-sub text-center py-6">正在加载未来 7 天排班…</p>';

          body.innerHTML = `<p class="text-sm text-danger text-center py-6">排班加载失败：${escapeHtml((res.data && res.data.detail) || '')}</p>`;
          return;

        apptPickDate = apptSchedule.dates[0];
        body.innerHTML = `
          <p class="text-xs text-text-sub mb-1">就诊日期：</p>
          <div id="dateRow" class="flex gap-1.5 overflow-x-auto custom-scroll pb-2 mb-2"></div>

          <div id="slotTable" class="overflow-x-auto"></div>

          <button id="backToDept" class="w-full mt-2 py-2 rounded-xl border border-gray-200 text-text-sub text-sm hover:text-primary transition">← 重新选科室</button>`;
        renderDateRow();
        renderSlotTable();
        document.getElementById('nextToForm').addEventListener('click', () => { apptStep = 2; renderApptStep2(); });
        document.getElementById('backToDept').addEventListener('click', () => { apptStep = 0; renderApptStep0(); });
      }

      function renderDateRow() {
        const row = document.getElementById('dateRow');
        row.innerHTML = apptSchedule.dates.map(d => {
          const day = new Date(d + 'T00:00:00');
          const label = (d === apptSchedule.dates[0] ? '今天' : '') + (['周日', '周一', '周二', '周三', '周四', '周五', '周六'][day.getDay()]) + ' ' + d.slice(5);
          const active = d === apptPickDate;
          return `<button data-date="${d}" class="date-chip text-[11px] px-2.5 py-1.5 rounded-lg border shrink-0 transition ${active ? 'bg-primary text-white border-primary' : 'border-gray-200 text-text-sub hover:border-primary hover:text-primary'}">${label}</button>`;
        }).join('');
        row.querySelectorAll('.date-chip').forEach(b => b.addEventListener('click', () => {
          apptPickDate = b.dataset.date;
          apptPick = null;
          renderDateRow(); renderSlotTable();
          document.getElementById('pickHint').textContent = '未选择';
          document.getElementById('nextToForm').disabled = true;
        }));
      }

      function renderSlotTable() {
        const table = document.getElementById('slotTable');
        const doctors = apptSchedule.doctors;
        table.innerHTML = `
          <table class="w-full text-xs border-collapse min-w-[420px]">
            <thead><tr class="bg-gray-50">
              <th class="px-2 py-2 text-left font-medium text-text-sub border border-gray-100">时段</th>
              ${doctors.map(d => `<th class="px-2 py-2 font-medium text-text-sub border border-gray-100">${escapeHtml(d.name)}<br/><span class="text-[10px] font-normal">${escapeHtml(d.title)}</span></th>`).join('')}
            </tr></thead>
            <tbody>
              ${apptSchedule.time_slots.map(slot => `
                <tr>
                  <td class="px-2 py-2 text-text-sub border border-gray-100 whitespace-nowrap">${escapeHtml(slot)}</td>
                  ${doctors.map(d => {
                    const remaining = apptSchedule.slots[apptPickDate][slot][d.name];
                    const picked = apptPick && apptPick.date === apptPickDate && apptPick.slot === slot && apptPick.doctor === d.name;
                    return `<td class="p-1 border border-gray-100 text-center">
                      ${remaining > 0
                        ? `<button data-slot="${slot}" data-doctor="${d.name}" class="slot-btn w-full py-1.5 rounded-lg transition ${picked ? 'bg-primary text-white' : 'bg-primary-light/50 text-primary hover:bg-primary-light'}">余${remaining}</button>`
                        : `<span class="text-text-sub/40">已满</span>`}
                    </td>`;
                  }).join('')}

        const name = document.getElementById('fName').value.trim();

      // ================== 服务三：图片问诊 ==================
      let visionFile = null;
      function renderVisionPanel() {
        messageContainer.innerHTML = serviceShell(`
          <h3 class="text-base font-semibold mb-1">📷 图片问诊（皮肤科）</h3>
          <p class="text-xs text-text-sub mb-3">上传皮损、皮疹、色素斑等照片，视觉大模型给出初步识别与护理建议。</p>
          <div id="dropZone" class="rounded-2xl border-2 border-dashed border-gray-200 hover:border-primary transition cursor-pointer py-10 text-center">
            <p class="text-3xl mb-2">🖼️</p>
            <p class="text-sm text-text-main">点击或拖拽上传图片</p>
            <p class="text-[11px] text-text-sub mt-1">支持 jpg / png / webp，不超过 8MB</p>
            <input type="file" id="visionInput" accept="image/*" class="hidden" />
          </div>
          <div id="visionPreview" class="hidden mt-3">
            <img id="visionImg" class="max-h-56 mx-auto rounded-xl border border-gray-100" alt="预览" />
          </div>
          <button id="analyzeBtn" disabled class="w-full mt-3 py-2.5 rounded-xl bg-primary text-white text-sm font-medium shadow-md shadow-primary/25 transition disabled:opacity-40">开始识别</button>
          <div id="visionResult" class="mt-3"></div>
          <p class="text-[11px] text-text-sub mt-3">⚠️ 识别结果仅供健康参考，不构成医疗诊断，请及时到皮肤科面诊。</p>`);
        const dz = document.getElementById('dropZone');
        const fi = document.getElementById('visionInput');
        dz.addEventListener('click', () => fi.click());
        dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('border-primary'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('border-primary'));
        dz.addEventListener('drop', e => {
          e.preventDefault(); dz.classList.remove('border-primary');
          if (e.dataTransfer.files.length) setVisionFile(e.dataTransfer.files[0]);
        });
        fi.addEventListener('change', () => { if (fi.files.length) setVisionFile(fi.files[0]); });
        document.getElementById('analyzeBtn').addEventListener('click', doVisionAnalyze);
      }

      function setVisionFile(file) {
        if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
        if (file.size > 8 * 1024 * 1024) { alert('图片不能超过 8MB'); return; }
        visionFile = file;
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('visionImg').src = e.target.result;
          document.getElementById('visionPreview').classList.remove('hidden');
          document.getElementById('analyzeBtn').disabled = false;
          document.getElementById('visionResult').innerHTML = '';
        };
        reader.readAsDataURL(file);
      }

      async function doVisionAnalyze() {
        if (!visionFile) return;
        const btn = document.getElementById('analyzeBtn');
        const result = document.getElementById('visionResult');
        btn.disabled = true; btn.textContent = '识别中（约 10-30 秒）…';
        result.innerHTML = '<p class="text-sm text-text-sub text-center py-6">视觉模型分析中…</p>';
        const fd = new FormData();
        fd.append('file', visionFile);
        const res = await apiFetch('/api/vision/analyze', { method: 'POST', body: fd });
        btn.disabled = false; btn.textContent = '重新识别';
        if (res.status === 503) {
          result.innerHTML = `<div class="rounded-xl bg-orange-50 border border-orange-200 p-4 text-xs leading-relaxed text-text-main">
            <p class="font-medium mb-1">🚧 图片问诊未启用（缺少视觉模型 Key）</p>
            <p>${escapeHtml(res.data.detail || '')}</p>
            <p class="mt-2">配置步骤：硅基流动官网注册 → 创建 API Key → 写入项目 .env 的 <code class="bg-white px-1 rounded">SILICONFLOW_API_KEY=sk-xxx</code> → 重启服务。</p>
          </div>`;
          return;
        }
        if (!res.ok) {
          result.innerHTML = `<p class="text-sm text-danger text-center py-6">识别失败：${escapeHtml((res.data && res.data.detail) || '')}</p>`;
          return;
        }
        const r = res.data.result || {};
        const riskCls = r.risk_level === '高风险' ? 'bg-red-50 text-danger' : r.risk_level === '中风险' ? 'bg-orange-50 text-warning' : 'bg-green-50 text-success';
        result.innerHTML = `
          <div class="rounded-2xl border border-gray-100 bg-white shadow-sm p-4 space-y-2">
            <div class="flex items-center justify-between">
              <p class="text-sm font-semibold">🔍 识别结果</p>
              <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${riskCls}">🛡️ ${escapeHtml(r.risk_level || '—')}</span>
            </div>
            <p class="text-xs font-medium text-text-main">📋 图片描述</p>
            <p class="text-[13px] leading-relaxed text-text-main">${escapeHtml(r.description || '')}</p>
            ${r.possible_conditions ? `<p class="text-xs font-medium text-text-main">🤔 可能的情况</p><p class="text-[13px] leading-relaxed text-text-main">${escapeHtml(r.possible_conditions)}</p>` : ''}
            ${r.advice ? `<p class="text-xs font-medium text-text-main">💡 建议</p><p class="text-[13px] leading-relaxed text-text-main">${escapeHtml(r.advice)}</p>` : ''}
            <button id="toAgentBtn" class="w-full mt-2 py-2 rounded-xl bg-primary text-white text-xs font-medium">🩺 将识别描述送入多智能体会诊，继续追问分析</button>
          </div>`;
        document.getElementById('toAgentBtn').addEventListener('click', () => {
          switchMode(MODE.AGENT);
          input.value = '我上传了一张皮肤照片，视觉识别结果如下：' + (r.description || '');
          autoResize();
        });
      }

      // ================== 健康档案开关（会诊模式） ==================
      async function refreshProfileToggle() {
        const toggle = document.getElementById('profileToggle');
        if (!token) { profileAvailable = false; toggle.classList.add('hidden'); return; }
        const res = await apiFetch('/api/profile/summary');
        profileAvailable = !!(res.ok && res.data && res.data.filled);
        if (profileAvailable) {
          // 默认勾选：档案已填写时自动携带
          const chk = document.getElementById('profileChk');
          if (chk && !chk.dataset.touched) chk.checked = true;
        }
        if (currentMode === MODE.AGENT) toggle.classList.toggle('hidden', !profileAvailable);
      }

      // ================== 流式气泡 ==================
      function createStreamBubble(statusText, mode) {
        const root = document.createElement('div');
        root.className = 'flex justify-start gap-2.5';

          <div class="max-w-[85%] sm:max-w-[75%] min-w-0">

                <p class="text-[11px] font-medium text-primary">AI 医疗助手</p>
                ${badge}
              </div>
              <p class="stream-status text-[11px] text-primary/80 mb-1 flex items-center gap-1.5">
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-primary"></span>
                <span class="status-text">${escapeHtml(statusText)}</span>

              <div class="stream-content text-sm leading-relaxed whitespace-pre-wrap break-words text-text-main"></div>

      // ================== 会诊过程面板（实时） ==================
      function buildProcessPanel(planData) {
        const isKnowledge = planData && planData.next_agent === 'rag';
        const seq = isKnowledge ? ['plan', 'rag', 'answer'] : ['plan', 'inquiry', 'parallel', 'specialty', 'answer'];

        const panel = document.createElement('div');
        panel.className = 'bg-white/80 border border-primary-light rounded-2xl px-4 py-3 mb-2';
        panel.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <p class="text-xs font-semibold text-primary">🩺 会诊过程${isKnowledge ? '（知识问答捷径）' : '（完整流程）'}</p>
            <span class="risk-badge hidden"></span>
          </div>
          <p class="plan-reason text-[11px] text-text-sub mt-1.5 leading-relaxed"></p>
          <div class="stages mt-2 border-t border-gray-100 pt-2"></div>
          <div class="rag-detail"></div>`;

        const state = {
          root: panel,
          stagesEl: panel.querySelector('.stages'),
          reasonEl: panel.querySelector('.plan-reason'),
          riskBadgeEl: panel.querySelector('.risk-badge'),
          ragDetailEl: panel.querySelector('.rag-detail'),
          isKnowledge,
          flow: isKnowledge ? 'knowledge' : 'consultation',
          reason: (planData && planData.reason) || '',
          pending: null,       // 当前执行中的阶段 key
          items: {},           // key -> { status, elapsed, startedAt, el }
          parallel: {},        // symptom/rag/risk -> { status, elapsed, startedAt, el }
          ragDetail: '',
          ragChunks: 0,
          risk: null,
          sources: [],
        };

        // 渲染阶段骨架
        const itemsHtml = seq.map(key => {
          if (key === 'parallel') {
            return `
              <div class="parallel-row flex gap-2 mt-2">
                ${['symptom', 'rag', 'risk'].map(k => `
                  <div class="parallel-item flex-1 min-w-0 bg-white rounded-lg border border-gray-100 px-2 py-2" data-pkey="${k}">
                    <p class="text-[10px] text-text-sub/70 text-center truncate">${AGENT_META[k].icon} ${AGENT_META[k].label}</p>
                    <p class="p-status text-[10px] text-center mt-0.5 text-text-sub/40">等待中</p>
                  </div>`).join('')}
              </div>`;
          }
          return `
            <div class="stage-item flex items-center gap-2.5 ${key === 'plan' ? '' : 'mt-2'}" data-key="${key}">
              <span class="s-dot w-5 h-5 rounded-full flex items-center justify-center text-[11px] shrink-0 bg-gray-100 text-text-sub/50">·</span>
              <span class="s-label text-xs font-medium text-text-sub/60">${AGENT_META[key].icon} ${AGENT_META[key].label}</span>
              <span class="s-status text-[10px] text-text-sub/40">等待中</span>
            </div>`;
        }).join('');
        state.stagesEl.innerHTML = itemsHtml;

        // 绑定阶段元素
        state.stagesEl.querySelectorAll('.stage-item').forEach(el => {
          state.items[el.dataset.key] = { el, status: 'waiting' };
        });
        state.stagesEl.querySelectorAll('.parallel-item').forEach(el => {
          state.parallel[el.dataset.pkey] = { el, status: 'waiting' };
        });

        function setItemStatus(item, status, extraText) {
          if (!item || item.status === 'done') return;
          const wasWaiting = item.status === 'waiting';
          item.status = status;
          const dot = item.el.querySelector('.s-dot');
          const label = item.el.querySelector('.s-label');
          const stat = item.el.querySelector('.s-status');
          if (status === 'running') {
            item.startedAt = Date.now();
            dot.className = 's-dot w-5 h-5 rounded-full flex items-center justify-center text-[11px] shrink-0 bg-primary text-white stage-running';
            dot.textContent = '▶';
            label.className = 's-label text-xs font-medium text-primary';
            stat.textContent = '执行中…';
            stat.className = 's-status text-[10px] text-primary';
          } else { // done
            const elapsed = item.startedAt ? ((Date.now() - item.startedAt) / 1000).toFixed(1) + 's' : '';
            item.elapsed = elapsed;
            dot.className = 's-dot w-5 h-5 rounded-full flex items-center justify-center text-[11px] shrink-0 bg-success/10 text-success';
            dot.textContent = '✓';
            label.className = 's-label text-xs font-medium text-text-main';
            stat.textContent = extraText || ('完成' + (elapsed ? ' · ' + elapsed : ''));
            stat.className = 's-status text-[10px] text-success';
          }
          if (wasWaiting && status === 'running') scrollToBottom();
        }
        function setParallelStatus(key, status, extraText) {
          const item = state.parallel[key];
          if (!item || item.status === 'done') return;
          item.status = status;
          const el = item.el;
          const stat = el.querySelector('.p-status');
          const title = el.querySelector('p');
          if (status === 'running') {
            item.startedAt = Date.now();
            el.className = 'parallel-item flex-1 min-w-0 bg-primary-light/60 rounded-lg border border-primary/30 px-2 py-2';
            title.className = 'text-[10px] text-primary text-center truncate';
            stat.textContent = '执行中…';
            stat.className = 'p-status text-[10px] text-center mt-0.5 text-primary';
            scrollToBottom();
          } else {
            const elapsed = item.startedAt ? ((Date.now() - item.startedAt) / 1000).toFixed(1) + 's' : '';
            item.elapsed = elapsed;
            el.className = 'parallel-item flex-1 min-w-0 bg-white rounded-lg border border-gray-100 px-2 py-2';
            title.className = 'text-[10px] text-text-sub text-center truncate';
            stat.textContent = extraText || ('完成' + (elapsed ? ' · ' + elapsed : ''));
            stat.className = 'p-status text-[10px] text-center mt-0.5 text-success';
          }
        }

        // 面板操作接口
        state.mark = function (key, status, extraText) {
          if (key in state.items) setItemStatus(state.items[key], status, extraText);
          else if (key in state.parallel) setParallelStatus(key, status, extraText);
        };
        state.markDone = function (key, extraText) { state.mark(key, 'done', extraText); };
        state.markRunning = function (key) { state.mark(key, 'running'); };
        // Agent 事件到达：上一个执行中的阶段完成，新阶段开始执行
        state.onAgent = function (key, data) {
          if (state.pending && state.pending !== key) state.markDone(state.pending);
          state.markRunning(key);
          state.pending = key;
        };
        state.setRagDetail = function (text, chunks) {
          state.ragDetail = text;
          state.ragChunks = chunks;
          state.ragDetailEl.innerHTML =
            `<details class="mt-2 text-[11px] text-text-sub"><summary class="cursor-pointer select-none hover:text-primary transition">📚 查看知识库检索详情（${chunks} 条）</summary><pre class="whitespace-pre-wrap mt-1.5 bg-gray-50 rounded-lg p-2 max-h-48 overflow-y-auto custom-scroll text-text-sub leading-relaxed">${escapeHtml(text)}</pre></details>`;
        };
        state.setRisk = function (risk) {
          state.risk = risk;
          if (!risk) return;
          const cls = risk.level === '高风险' ? 'bg-red-50 text-danger' : risk.level === '中风险' ? 'bg-orange-50 text-warning' : 'bg-green-50 text-success';
          state.riskBadgeEl.className = 'risk-badge text-[10px] px-2 py-0.5 rounded-full font-medium ' + cls;
          state.riskBadgeEl.textContent = '🛡️ ' + risk.level;
        };
        state.setSources = function (labels) { state.sources = labels; };
        state.setReason = function (r) { state.reason = r; state.reasonEl.textContent = '🧭 ' + r; };
        state.snapshot = function () {
          const stages = Object.keys(state.items).map(k => {
            const it = state.items[k];
            return { key: k, status: it.status === 'waiting' ? 'waiting' : 'done', elapsed: it.elapsed };
          });
          const parallel = ['symptom', 'rag', 'risk'].map(k => {
            const it = state.parallel[k];
            return { key: k, status: it.status === 'waiting' ? 'waiting' : 'done', elapsed: it.elapsed };
          });
          return {
            flow: state.flow,
            reason: state.reason,
            stages,
            parallel,
            ragDetail: state.ragDetail,
            ragChunks: state.ragChunks,
            risk: state.risk,
            sources: state.sources,
          };
        };

        // 初始：规划阶段直接完成并显示判断理由
        state.reasonEl.textContent = '🧭 ' + (state.reason || 'Supervisor 已完成流程规划');
        state.markDone('plan');
        return state;
      }

      // ================== 会话操作 ==================
      function createSession() {
        const id = 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const now = Date.now();
        sessions.unshift({ id, title: '新的会话', messages: [], createdAt: now, updatedAt: now });
        currentId = id;
        saveSessions(); renderSidebar(); renderMessages();
        return id;
      }
      function switchSession(id) {
        if (isTyping) return;
        currentId = id;
        renderSidebar(); renderMessages();
      }
      function deleteSession(id) {
        if (!confirm('确定删除该会话吗？')) return;
        sessions = sessions.filter(s => s.id !== id);
        if (currentId === id) currentId = sessions.length ? sessions[0].id : null;
        saveSessions(); renderSidebar(); renderMessages();
      }
      function clearAll() {
        if (!sessions.length) return;
        if (!confirm('确定清空全部历史会话吗？此操作不可恢复。')) return;
        sessions = []; currentId = null;
        saveSessions(); renderSidebar(); renderMessages();
      }

      // 侧边栏事件委托
      sessionList.addEventListener('click', e => {
        const item = e.target.closest('.session-item');
        if (!item) return;
        const id = item.dataset.id;
        if (e.target.closest('[data-action="delete"]')) { e.stopPropagation(); deleteSession(id); return; }
        switchSession(id);
        closeSidebar();
      });
      document.getElementById('newChatBtn').addEventListener('click', () => { createSession(); closeSidebar(); });
      document.getElementById('clearAllBtn').addEventListener('click', clearAll);

      // ================== 模式切换 ==================
      function switchMode(mode) {
        if (isTyping || mode === currentMode) return;
        currentMode = mode;
        const tabIds = ['tabChat', 'tabAgent', 'tabSearch', 'tabAppt', 'tabHospital', 'tabVision', 'tabProfile'];
        tabIds.forEach(id => {
          const t = document.getElementById(id);
          const active = t.dataset.mode === mode;
          t.className = 'flex-1 sm:flex-none sm:px-6 py-2 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1.5 ' +
            (active ? 'bg-primary text-white shadow-md shadow-primary/25' : 'text-text-sub hover:bg-gray-50');
        });
        modeHint.textContent = MODE_META[mode].hint;
        input.placeholder = MODE_META[mode].placeholder;
        // 服务模式隐藏输入框，内容区渲染对应服务面板
        document.getElementById('inputBar').classList.toggle('hidden', SERVICE_MODES.includes(mode));
        document.getElementById('profileToggle').classList.toggle('hidden', mode !== MODE.AGENT || !profileAvailable);
        if (mode === MODE.AGENT) refreshProfileToggle();
        renderMessages();
        if (!SERVICE_MODES.includes(mode)) input.focus();
      }
      ['tabChat', 'tabAgent', 'tabSearch', 'tabAppt', 'tabHospital', 'tabVision', 'tabProfile'].forEach(id => {
        const t = document.getElementById(id);
        if (t) t.addEventListener('click', () => switchMode(t.dataset.mode));
      });
      let profileAvailable = false; // 已登录且档案已填写

      // ================== 消息收发 ==================
      function appendMessage(role, content, extra, silent) {
        const session = sessions.find(s => s.id === currentId);
        if (!session) return;
        session.messages.push(Object.assign({ role, content, time: Date.now() }, extra || {}));
        session.updatedAt = Date.now();
        sortSessions();
        saveSessions();
        renderSidebar();
        if (!silent) renderMessages();
      }

      // 通用 SSE 解析：逐行读 data: {...} 事件，回调处理
      async function consumeSSE(resp, onEvent, onDone) {
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let finished = false;
        while (!finished) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf('\n')) >= 0) {
            const line = buf.slice(0, nl).trim();
            buf = buf.slice(nl + 1);
            if (!line.startsWith('data:')) continue;
            const payload = line.slice(5).trim();
            if (payload === '[DONE]') { finished = true; break; }
            let ev;
            try { ev = JSON.parse(payload); } catch (e) { continue; }
            onEvent(ev);
          }
        }
        if (onDone) onDone();
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text || isTyping || SERVICE_MODES.includes(currentMode)) return;

        // 知识库检索模式：独立处理，不进会话历史
        if (currentMode === MODE.SEARCH) { doSearch(text); return; }

        if (!currentId) createSession();
        appendMessage('user', text, { mode: currentMode });
        input.value = '';
        autoResize();

        const session = sessions.find(s => s.id === currentId);
        const history = session.messages
          .filter(m => m.role === 'user' || m.role === 'assistant')
          .slice(0, -1).slice(-20)
          .map(m => ({ role: m.role, content: m.content }));

        isTyping = true;
        if (currentMode === MODE.AGENT) await streamAgent(text, history);
        else await streamChat(text, history);
        isTyping = false;
        input.focus();
      }

      // ---------- 模式一：智能问答（/api/chat，大模型直接回答） ----------
      async function streamChat(text, history) {
        const bubble = createStreamBubble('正在思考…', MODE.CHAT);
        messageContainer.appendChild(bubble.root);
        scrollToBottom();
        let gotContent = false;
        try {
          const headers = { 'Content-Type': 'application/json' };
          if (token) headers['Authorization'] = 'Bearer ' + token;
          const resp = await fetch(API_BASE + '/api/chat', {
            method: 'POST', headers,
            body: JSON.stringify({ message: text, history }),
          });
          if (!resp.ok || !resp.body) throw new Error('服务异常（HTTP ' + resp.status + '）');
          await consumeSSE(resp, ev => {
            if (ev.content) {
              bubble.contentEl.textContent += ev.content;
              gotContent = true;
              bubble.statusEl.classList.add('hidden');
              scrollToBottom();
            } else if (ev.error) {
              bubble.contentEl.textContent = '⚠️ ' + ev.error;
              gotContent = true;
            }
          });
        } catch (err) {
          bubble.contentEl.textContent = '⚠️ 请求失败：' + (err.message || '网络异常，请确认后端服务已启动');
          gotContent = true;
        } finally {
          if (gotContent) appendMessage('assistant', bubble.contentEl.textContent, { mode: MODE.CHAT }, true);
          else bubble.root.remove();
        }
      }

      // ---------- 模式二：多智能体会诊（/api/agent/chat，全流程可视化） ----------
      async function streamAgent(text, history) {
        let panel = null;          // 会诊过程面板（plan 事件后创建）
        let bubble = null;         // 当前流式回答气泡
        let turnExtra = { mode: MODE.AGENT }; // 本轮首条 assistant 消息附加数据
        let firstSaved = false;    // 过程面板只挂在第一条 assistant 消息上

        function finalizeBubble(extra) {
          if (!bubble) return;
          const content = bubble.contentEl.textContent;
          if (content) appendMessage('assistant', content, Object.assign({}, extra || {}), true);
          else bubble.root.remove();
          bubble = null;
        }

        try {
          const headers = { 'Content-Type': 'application/json' };
          if (token) headers['Authorization'] = 'Bearer ' + token;
          const resp = await fetch(API_BASE + '/api/agent/chat', {
            method: 'POST', headers,
            body: JSON.stringify({
              message: text, history,
              // 会诊时携带健康档案（登录且已填档案时开关可见）
              include_profile: !!(document.getElementById('profileChk') && document.getElementById('profileChk').checked),
            }),
          });
          if (!resp.ok || !resp.body) throw new Error('服务异常（HTTP ' + resp.status + '）');

          await consumeSSE(resp, ev => {
            if (ev.type === 'plan') {
              panel = buildProcessPanel(ev.data);
              messageContainer.appendChild(panel.root);
              scrollToBottom();
            } else if (ev.type === 'agent') {
              const name = ev.data && ev.data.name;
              if (panel) {
                panel.onAgent(name, ev.data);
                // RAG 检索详情可展开查看
                if (name === 'rag' && ev.data && ev.data.result) {
                  const chunks = (ev.data.result.match(/\[(\d+)\]/g) || []).length;
                  panel.setRagDetail(ev.data.result, chunks);
                }
                // 风险评估结果解析为徽章
                if (name === 'risk' && ev.data && ev.data.result) {
                  let risk = null;
                  try { risk = JSON.parse(ev.data.result); } catch (e) { /* 非 JSON 则忽略 */ }
                  if (risk && risk.risk_level) {
                    panel.setRisk({ level: risk.risk_level });
                    if (risk.risk_level === '高风险') {
                      const warn = document.createElement('p');
                      warn.className = 'text-[11px] text-danger font-medium mt-2 bg-red-50 rounded-lg px-2.5 py-1.5';
                      warn.textContent = '🚨 风险评估为高风险，请立即就医';
                      panel.stagesEl.appendChild(warn);
                    }
                  }
                }
              }
            } else if (ev.type === 'question') {
              // 问诊追问：结束当前输出段，追问以"医生追问"气泡展示
              if (panel) { panel.markDone('inquiry', '已追问'); }
              finalizeBubble(turnExtra);
              appendMessage('assistant', ev.data, { mode: MODE.AGENT, isQuestion: true, process: panel ? panel.snapshot() : undefined });
              firstSaved = true;
              bubble = null;
            } else if (ev.type === 'content') {
              // 回答内容开始生成：把"生成回答"阶段推进为执行中
              if (panel && panel.pending !== 'answer') panel.onAgent('answer', null);
              if (!bubble) {
                bubble = createStreamBubble('综合回答生成中…', MODE.AGENT);
                messageContainer.appendChild(bubble.root);
              }
              bubble.contentEl.textContent += ev.data;
              bubble.statusEl.classList.add('hidden');
              scrollToBottom();
            } else if (ev.type === 'done') {
              const d = ev.data || {};
              if (panel) {
                panel.markDone(panel.pending || 'answer', undefined);
                const labels = [...new Set((d.sources || []).map(sourceLabel))].slice(0, 4);
                panel.setSources(labels);
                if (bubble && labels.length) {
                  bubble.sourcesEl.textContent = '📚 参考来源：' + labels.join('；');
                  bubble.sourcesEl.classList.remove('hidden');
                }
              }
              const extra = Object.assign({}, turnExtra);
              if (d.risk_level) extra.risk_level = d.risk_level;
              if (d.sources && d.sources.length) {
                extra.sources = [...new Set(d.sources.map(sourceLabel))].slice(0, 4);
              }
              finalizeBubble(extra);
            } else if (ev.type === 'error') {
              finalizeBubble(turnExtra);
              appendMessage('assistant', '⚠️ ' + (ev.data || '服务暂时不可用，请稍后重试'), { mode: MODE.AGENT });
              firstSaved = true;
            }
          });
        } catch (err) {
          finalizeBubble(turnExtra);
          appendMessage('assistant', '⚠️ 请求失败：' + (err.message || '网络异常，请确认后端服务已启动'), { mode: MODE.AGENT });
          firstSaved = true;
        } finally {
          // 把过程面板快照挂到本轮第一条 assistant 消息上（供历史回放）
          if (panel) {
            const snap = panel.snapshot();
            const session = sessions.find(s => s.id === currentId);
            if (session) {
              if (!firstSaved && session.messages.length && session.messages[session.messages.length - 1].role === 'assistant' && session.messages[session.messages.length - 1].mode === MODE.AGENT) {
                session.messages[session.messages.length - 1].process = snap;
              } else if (!firstSaved) {
                // 没有回答内容：面板不展示（如错误中断）
              }
            }
            saveSessions();
          }
          if (bubble) finalizeBubble(turnExtra);
        }
      }

      // ---------- 模式三：知识库检索（/api/knowledge/search） ----------
      async function doSearch(query) {
        input.value = '';
        autoResize();
        const started = Date.now();
        messageContainer.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16">
            <div class="w-10 h-10 rounded-xl bg-primary-light flex items-center justify-center mb-3">
              <div class="flex gap-1">
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-primary"></span>
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-primary"></span>
                <span class="typing-dot w-1.5 h-1.5 rounded-full bg-primary"></span>
              </div>
            </div>
            <p class="text-sm text-text-sub">正在检索医疗知识库…</p>
            <p class="text-xs text-text-sub/70 mt-1">向量召回 + 重排精排</p>
          </div>`;
        try {
          const headers = { 'Content-Type': 'application/json' };
          if (token) headers['Authorization'] = 'Bearer ' + token;
          const resp = await fetch(API_BASE + '/api/knowledge/search', {
            method: 'POST', headers,
            body: JSON.stringify({ query, top_k: 6, top_n: 3 }),
          });
          if (!resp.ok) throw new Error('服务异常（HTTP ' + resp.status + '）');
          const data = await resp.json();
          renderSearchResults(query, data, ((Date.now() - started) / 1000).toFixed(1));
        } catch (err) {
          messageContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center py-16">
              <p class="text-3xl mb-3">😞</p>
              <p class="text-sm text-text-main font-medium">检索失败</p>
              <p class="text-xs text-text-sub mt-1">${escapeHtml(err.message || '网络异常，请确认后端服务已启动')}</p>
              <button id="retrySearch" class="mt-4 text-xs px-4 py-2 rounded-full bg-primary text-white hover:bg-primary-dark transition">返回检索</button>
            </div>`;
          document.getElementById('retrySearch').addEventListener('click', () => renderMessages());
        }
      }
      function renderSearchResults(query, data, seconds) {
        const items = data.items || [];
        if (!items.length) {
          messageContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center py-16">
              <p class="text-3xl mb-3">🔍</p>
              <p class="text-sm text-text-main font-medium">未检索到相关知识</p>
              <p class="text-xs text-text-sub mt-1">试试换个关键词，如"高血压""糖尿病"</p>
            </div>`;
          return;
        }
        // 重排未启用（未配重排 API Key）时分数全为 0，此时只展示排序不展示百分比
        const hasScores = items.some(it => it.score > 0);
        const cards = items.map((it, i) => `
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-primary-light text-primary font-medium shrink-0">${hasScores ? '#' + (i + 1) + ' 相关度 ' + (it.score * 100).toFixed(0) + '%' : '#' + (i + 1) + ' 原文片段'}</span>
              <span class="text-[11px] text-text-sub truncate">📄 ${escapeHtml(sourceLabel(it))}</span>
            </div>
            <p class="search-content line-clamp-4 text-[13px] leading-relaxed text-text-main whitespace-pre-wrap">${escapeHtml(it.content)}</p>
            <button class="expand-btn text-[11px] text-primary mt-1.5 hover:underline" data-expanded="0">展开全文</button>
          </div>`).join('');
        messageContainer.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <p class="text-sm font-medium text-text-main">检索结果：<span class="text-primary">命中 ${data.count} 条</span></p>
            <p class="text-[11px] text-text-sub">耗时 ${seconds}s · 向量召回+重排</p>
          </div>
          <div class="text-[11px] text-text-sub mb-3 bg-primary-light/50 rounded-xl px-3 py-2">
            查询："${escapeHtml(query)}" —— 知识源：《内科学》《外科学》（第10版）教材，共 8398 个知识片段
          </div>
          <div class="space-y-3">${cards}</div>
          <button id="backToSearch" class="mt-5 text-xs px-4 py-2 rounded-full border border-gray-200 text-text-sub hover:text-primary hover:border-primary transition block mx-auto">继续检索</button>`;
        // 展开/收起检索内容
        messageContainer.querySelectorAll('.expand-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const content = btn.parentElement.querySelector('.search-content');
            const expanded = btn.dataset.expanded === '1';
            content.classList.toggle('line-clamp-4', expanded);
            btn.textContent = expanded ? '展开全文' : '收起';
            btn.dataset.expanded = expanded ? '0' : '1';
          });
        });
        document.getElementById('backToSearch').addEventListener('click', () => renderMessages());
        scrollToBottom();
      }

      // 空状态推荐问题（点击即发送）
      messageContainer.addEventListener('click', e => {
        const chip = e.target.closest('[data-chip]');
        if (chip) { input.value = chip.textContent.trim(); autoResize(); sendMessage(); }
      });

      // ================== 输入框交互 ==================
      function autoResize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      }
      input.addEventListener('input', autoResize);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          sendMessage();
        }
      });
      document.getElementById('sendBtn').addEventListener('click', sendMessage);

      // ================== 登录态 UI ==================
      function setUserUI(name, isGuest) {
        document.getElementById('userName').textContent = name;
        document.getElementById('userAvatar').textContent = name.charAt(0);
        const btn = document.getElementById('logoutBtn');
        if (isGuest) {
          btn.title = '登录';
          btn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>
            </svg>
            <span id="logoutLabel" class="hidden sm:inline">登录</span>`;
        } else {
          btn.title = '退出登录';
          btn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
            </svg>
            <span id="logoutLabel" class="hidden sm:inline">退出</span>`;
        }
      }
      async function initAuth() {
        if (!token) { setUserUI('访客', true); return; }
        try {
          const res = await fetch(API_BASE + '/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + token },
          });
          if (res.ok) {
            const data = await res.json();
            setUserUI(data.username || username || '用户', false);
            refreshProfileToggle();
            return;
          }
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem(USER_KEY);
        } catch (err) {
          setUserUI(username || '用户', false);
          return;
        }
        setUserUI('访客', true);
      }

      // ================== 退出登录 ==================
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (localStorage.getItem(TOKEN_KEY)) {
          if (!confirm('确定退出登录吗？')) return;
          try {
            await fetch(API_BASE + '/api/auth/logout', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + localStorage.getItem(TOKEN_KEY) },
            });
          } catch (e) { /* 后端不可达时仍允许本地退出 */ }
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem(USER_KEY);
          window.location.reload();
        } else {
          window.location.replace('login.html');
        }
      });

      // ================== 初始化 ==================
      loadSessions();
      sortSessions();
      if (sessions.length) currentId = sessions[0].id;
      modeHint.textContent = MODE_META[MODE.CHAT].hint;
      input.placeholder = MODE_META[MODE.CHAT].placeholder;
      renderSidebar();
      renderMessages();
      initAuth();
    })();
  </script>
</body>
</html>
