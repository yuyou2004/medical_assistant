<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>登录 - ClinicMind Health Assistant</title>

  <!-- 字体：Inter（拉丁/数字）+ Noto Sans SC（中文），工整高级的无衬线字族 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- CDN 引入 Tailwind CSS v3（无需本地依赖） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#5B2C6F',        // 主色：手术服深紫
            'primary-dark': '#452256', // 主色加深（hover）
            'primary-light': '#F1EAF6',// 辅助浅紫（标签/浅底）
            'text-main': '#1D2129',    // 文字主色
            'text-sub': '#6E7681',     // 次要文字
            danger: '#F53F3F'          // 危险提示色
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", sans-serif;
      text-rendering: optimizeLegibility;
    }
    h1, h2, h3 { letter-spacing: -0.01em; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp .5s ease both; }
  </style>
</head>

<body class="min-h-screen bg-[#6F4E9C] text-text-main antialiased overflow-x-hidden">
  <!-- 背景：淡紫渐变（呼吸感、通透）+ 柔和光晕 -->
  <div class="fixed inset-0 -z-10 bg-gradient-to-br from-[#8A68B5] via-[#6F4E9C] to-[#5B3D85]"></div>
  <div class="fixed -z-10 top-[-120px] right-[-80px] w-[340px] h-[340px] rounded-full bg-[#A98CD0] opacity-30 blur-3xl"></div>
  <div class="fixed -z-10 bottom-[-120px] left-[-80px] w-[320px] h-[320px] rounded-full bg-[#B49BD8] opacity-25 blur-3xl"></div>

  <div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md animate-fade-up">

      <!-- 登录卡片 -->
      <div class="bg-white rounded-2xl shadow-[0_18px_50px_-12px_rgba(91,44,111,0.25)] p-8 sm:p-10">

        <!-- 标题 -->
        <div class="flex flex-col items-center text-center mb-8">
          <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-text-main leading-none">ClinicMind</h1>
          <p class="text-lg sm:text-xl font-semibold tracking-wide text-primary leading-none mt-1.5">Health Assistant</p>

          <!-- 功能标签 -->
          <div class="flex flex-wrap justify-center gap-2 mt-4">
            <span class="text-xs px-2.5 py-1 rounded-full bg-primary-light text-primary">预约挂号</span>
            <span class="text-xs px-2.5 py-1 rounded-full bg-primary-light text-primary">报告查询</span>
            <span class="text-xs px-2.5 py-1 rounded-full bg-primary-light text-primary">健康提醒</span>
          </div>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="space-y-5" novalidate>
          <div>
            <label for="username" class="block text-sm font-medium mb-2 text-text-main">账号</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-text-sub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input id="username" type="text" maxlength="20" autocomplete="username"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 bg-[#F8F9FB] text-sm text-text-main placeholder:text-text-sub/70 outline-none transition focus:border-primary focus:ring-4 focus:ring-primary/10"
                placeholder="请输入账号" />
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium mb-2 text-text-main">密码</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-text-sub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input id="password" type="password" autocomplete="current-password"
                class="w-full pl-11 pr-11 py-3 rounded-xl border border-gray-200 bg-[#F8F9FB] text-sm text-text-main placeholder:text-text-sub/70 outline-none transition focus:border-primary focus:ring-4 focus:ring-primary/10"
                placeholder="请输入密码" />
              <!-- 密码显示/隐藏切换 -->
              <button type="button" id="togglePwd" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-text-sub hover:text-primary transition" aria-label="显示/隐藏密码">
                <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- 错误提示 -->
          <p id="errorMsg" class="hidden text-sm text-danger"></p>

          <button id="submitBtn" type="submit"
            class="w-full py-3 rounded-xl bg-primary hover:bg-primary-dark active:scale-[0.98] text-white font-medium text-[15px] shadow-lg shadow-primary/30 transition disabled:opacity-60 disabled:cursor-not-allowed">
            登 录
          </button>
        </form>

        <!-- 注册入口 -->
        <p class="mt-6 text-center text-sm text-text-sub">
          还没有账号？
          <a href="register.html" class="text-primary font-medium hover:underline underline-offset-4">一键注册</a>
        </p>

        <!-- 访客入口（无需登录，本地体验） -->
        <button id="guestBtn" class="w-full mt-4 py-2.5 rounded-xl border border-gray-200 text-text-sub hover:text-primary hover:border-primary hover:bg-primary-light/30 text-sm transition">
          暂不登录，以访客身份进入 →
        </button>
      </div>

      <!-- 底部安全提示 -->
      <p class="text-center text-xs text-white/70 mt-6 px-4 leading-relaxed">
        ⚠️ 本产品仅供健康科普参考，不构成医疗诊断，如有身体不适请及时线下就医
      </p>
    </div>
  </div>

  <script>
    (function () {
      const TOKEN_KEY = 'rag_med_token';
      const USER_KEY  = 'rag_med_username';
      const API_BASE  = '';

      // 已登录则直接跳转聊天页，避免重复登录
      if (localStorage.getItem(TOKEN_KEY)) {
        window.location.replace('index.html');
        return;
      }

      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
      }
      function hideError() { errorMsg.classList.add('hidden'); }

      // 请求封装：统一处理网络异常 / 后端未启动 / 非 JSON 响应 / 业务错误
      async function postJson(path, body) {
        let resp;
        try {
          resp = await fetch(API_BASE + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
        } catch (e) {
          showError('无法连接服务器，请确认后端服务已启动后重试。');
          return null;
        }
        let data = null;
        try { data = await resp.json(); } catch (e) { /* 非 JSON 响应 */ }
        if (!resp.ok) {
          if (resp.status === 503) {
            showError((data && data.detail) || '用户系统未启用：请启动 MySQL 并设置 MYSQL_ENABLED=1 后重启服务');
            return null;
          }
          showError((data && data.detail) || ('请求失败（HTTP ' + resp.status + '）'));
          return null;
        }
        return data;
      }

      // 密码显示/隐藏
      const eyeIcon = document.getElementById('eyeIcon');
      document.getElementById('togglePwd').addEventListener('click', () => {
        const isPwd = passwordInput.type === 'password';
        passwordInput.type = isPwd ? 'text' : 'password';
        eyeIcon.innerHTML = isPwd
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });

      // 提交登录：账号 + 密码
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username) { showError('请输入账号'); usernameInput.focus(); return; }
        if (!password) { showError('请输入密码'); passwordInput.focus(); return; }

        const body = { username, password };

        submitBtn.disabled = true;
        submitBtn.textContent = '登录中…';
        try {
          const data = await postJson('/api/auth/login', body);
          if (!data) return;
          localStorage.setItem(TOKEN_KEY, data.token);
          localStorage.setItem(USER_KEY, data.username);
          window.location.replace('index.html');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '登 录';
        }
      });

      // 访客进入
      document.getElementById('guestBtn').addEventListener('click', () => {
        window.location.replace('index.html');
      });
    })();
  </script>
</body>
</html>
