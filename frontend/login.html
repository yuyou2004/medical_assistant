<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ClinicMind Health Assistant</title>

  <!-- 字体：Inter（拉丁/数字）+ Noto Sans SC（中文），工整高级的无衬线字族 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- CDN 引入 Tailwind CSS v3（无需本地依赖） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 自定义主题色：高级医疗风配色 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#5B2C6F',        // 主色：手术服深紫
            'primary-dark': '#452256', // 主色加深（hover）
            'primary-light': '#F1EAF6',// 辅助浅紫（标签/浅底）
            'text-main': '#1D2129',    // 文字主色
            'text-sub': '#6E7681',     // 次要文字
            danger: '#F53F3F'          // 危险提示色
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", sans-serif;
      text-rendering: optimizeLegibility;
    }
    /* 标题与品牌名：轻微收紧字距，更显工整高级 */
    h1, h2, h3 { letter-spacing: -0.01em; }
    /* 卡片入场动画 */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp .5s ease both; }
  </style>
</head>

<body class="min-h-screen bg-[#6F4E9C] text-text-main antialiased overflow-x-hidden">
  <!-- 背景：淡紫渐变（呼吸感、通透）+ 柔和光晕 -->
  <div class="fixed inset-0 -z-10 bg-gradient-to-br from-[#8A68B5] via-[#6F4E9C] to-[#5B3D85]"></div>
  <div class="fixed -z-10 top-[-120px] right-[-80px] w-[340px] h-[340px] rounded-full bg-[#A98CD0] opacity-30 blur-3xl"></div>
  <div class="fixed -z-10 bottom-[-120px] left-[-80px] w-[320px] h-[320px] rounded-full bg-[#B49BD8] opacity-25 blur-3xl"></div>

  <div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md animate-fade-up">

      <!-- 登录卡片 -->
      <div class="bg-white rounded-2xl shadow-[0_18px_50px_-12px_rgba(91,44,111,0.25)] p-8 sm:p-10">

        <!-- 标题 -->
        <div class="flex flex-col items-center text-center mb-8">
          <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-text-main leading-none">ClinicMind</h1>
          <p class="text-lg sm:text-xl font-semibold tracking-wide text-primary leading-none mt-1.5">Health Assistant</p>
          <p class="text-sm text-text-sub mt-3">基于多 Agent + RAG 的智能健康咨询服务</p>

          <!-- 功能标签 -->
          <div class="flex flex-wrap justify-center gap-2 mt-4">
            <span class="text-xs px-2.5 py-1 rounded-full bg-primary-light text-primary">多智能体协同</span>
            <span class="text-xs px-2.5 py-1 rounded-full bg-primary-light text-primary">RAG 检索增强</span>
            <span class="text-xs px-2.5 py-1 rounded-full bg-primary-light text-primary">医疗咨询</span>
          </div>
        </div>

        <!-- 登录 / 注册 切换 -->
        <div class="flex bg-gray-100 rounded-xl p-1 mb-6" role="tablist" aria-label="登录或注册">
          <button type="button" id="tabLogin" role="tab" aria-selected="true" class="flex-1 py-2 rounded-lg text-sm font-medium transition bg-white text-text-main shadow-sm">登录</button>
          <button type="button" id="tabRegister" role="tab" aria-selected="false" class="flex-1 py-2 rounded-lg text-sm font-medium transition text-text-sub">注册</button>
        </div>

        <!-- 登录 / 注册表单 -->
        <form id="loginForm" class="space-y-5" novalidate>
          <div>
            <label for="username" class="block text-sm font-medium mb-2 text-text-main">用户名</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-text-sub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input id="username" type="text" autocomplete="username"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 bg-[#F8F9FB] text-sm text-text-main placeholder:text-text-sub/70 outline-none transition focus:border-primary focus:ring-4 focus:ring-primary/10"
                placeholder="请输入用户名" />
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium mb-2 text-text-main">密码</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-text-sub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input id="password" type="password" autocomplete="current-password"
                class="w-full pl-11 pr-11 py-3 rounded-xl border border-gray-200 bg-[#F8F9FB] text-sm text-text-main placeholder:text-text-sub/70 outline-none transition focus:border-primary focus:ring-4 focus:ring-primary/10"
                placeholder="请输入密码" />
              <!-- 密码显示/隐藏切换 -->
              <button type="button" id="togglePwd" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-text-sub hover:text-primary transition" aria-label="显示/隐藏密码">
                <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- 确认密码（仅注册模式显示） -->
          <div id="confirmGroup" class="hidden">
            <label for="confirmPassword" class="block text-sm font-medium mb-2 text-text-main">确认密码</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-text-sub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input id="confirmPassword" type="password" autocomplete="new-password"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 bg-[#F8F9FB] text-sm text-text-main placeholder:text-text-sub/70 outline-none transition focus:border-primary focus:ring-4 focus:ring-primary/10"
                placeholder="请再次输入密码" />
            </div>
          </div>

          <!-- 错误提示 -->
          <p id="errorMsg" class="hidden text-sm text-danger"></p>

          <button id="submitBtn" type="submit"
            class="w-full py-3 rounded-xl bg-primary hover:bg-primary-dark active:scale-[0.98] text-white font-medium text-[15px] shadow-lg shadow-primary/30 transition disabled:opacity-60 disabled:cursor-not-allowed">
            登 录
          </button>
        </form>

        <!-- 演示环境提示 -->
        <div class="mt-6 text-center text-xs text-text-sub bg-primary-light/60 rounded-xl p-3 leading-relaxed">
          演示环境：请先注册账号，再登录使用（数据保存在本地浏览器）
        </div>
      </div>

      <!-- 底部安全提示 -->
      <p class="text-center text-xs text-white/70 mt-6 px-4 leading-relaxed">
        ⚠️ 本产品仅供健康科普参考，不构成医疗诊断，如有身体不适请及时线下就医
      </p>
    </div>
  </div>

  <script>
    (function () {
      // ================== 登录 / 注册鉴权（前端模拟） ==================
      const TOKEN_KEY = 'rag_med_token';     // localStorage 中保存 token 的 key
      const USER_KEY  = 'rag_med_username';  // localStorage 中保存用户名的 key
      const USERS_KEY = 'rag_med_users';     // localStorage 中保存已注册账号的 key

      // 已登录则直接跳转聊天页，避免重复登录
      if (localStorage.getItem(TOKEN_KEY)) {
        window.location.replace('index.html');
        return;
      }

      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirmPassword');
      const confirmGroup = document.getElementById('confirmGroup');
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');

      let isRegister = false; // 当前是否处于注册模式

      // 根据用户名生成稳定的 token：
      // 同一用户名在任意浏览器/设备登录得到的 token 相同，
      // 从而模拟“多设备登录看到同一份历史会话”的效果。
      function hashToken(str) {
        let h = 5381;
        for (let i = 0; i < str.length; i++) {
          h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
        }
        return 'tk_' + h.toString(16);
      }
      // 密码做一层简单哈希后存储，避免明文落盘（仅演示，非真实安全加密）
      function hashPassword(pwd) {
        const s = 'clinicmind::' + pwd;
        let h = 5381;
        for (let i = 0; i < s.length; i++) {
          h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
        }
        return 'pwd_' + h.toString(16);
      }

      // 读取 / 写入已注册用户
      function loadUsers() {
        try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }
        catch (e) { return {}; }
      }
      function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      }

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
      }
      function hideError() { errorMsg.classList.add('hidden'); }

      // 切换登录 / 注册模式
      function setMode(register) {
        isRegister = register;
        hideError();
        const active = 'flex-1 py-2 rounded-lg text-sm font-medium transition bg-white text-text-main shadow-sm';
        const inactive = 'flex-1 py-2 rounded-lg text-sm font-medium transition text-text-sub';
        tabLogin.className = register ? inactive : active;
        tabRegister.className = register ? active : inactive;
        tabLogin.setAttribute('aria-selected', String(!register));
        tabRegister.setAttribute('aria-selected', String(register));
        if (register) {
          confirmGroup.classList.remove('hidden');
          submitBtn.textContent = '注 册';
        } else {
          confirmGroup.classList.add('hidden');
          submitBtn.textContent = '登 录';
        }
      }
      tabLogin.addEventListener('click', () => setMode(false));
      tabRegister.addEventListener('click', () => setMode(true));

      // 密码显示/隐藏
      const togglePwd = document.getElementById('togglePwd');
      const eyeIcon = document.getElementById('eyeIcon');
      togglePwd.addEventListener('click', () => {
        const isPwd = passwordInput.type === 'password';
        passwordInput.type = isPwd ? 'text' : 'password';
        eyeIcon.innerHTML = isPwd
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });

      // 提交（登录 / 注册共用）
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        // 基础校验
        if (!username) { showError('请输入用户名'); usernameInput.focus(); return; }
        if (!password) { showError('请输入密码'); passwordInput.focus(); return; }

        const users = loadUsers();

        // ============ 注册流程 ============
        if (isRegister) {
          const confirm = confirmInput.value;
          if (username.length < 2) { showError('用户名至少 2 个字符'); usernameInput.focus(); return; }
          if (password.length < 6) { showError('密码至少 6 位'); passwordInput.focus(); return; }
          if (password !== confirm) { showError('两次输入的密码不一致'); confirmInput.focus(); return; }
          if (users[username]) { showError('该用户名已被注册，请直接登录'); usernameInput.focus(); return; }

          submitBtn.disabled = true;
          submitBtn.textContent = '注册中…';
          try {
            // ============【这里对接后端API】============
            // 真实后端接入示例（对接 FastAPI 多 Agent 医疗后端）：
            //
            // const res = await fetch('/api/auth/register', {
            //   method: 'POST',
            //   headers: { 'Content-Type': 'application/json' },
            //   body: JSON.stringify({ username, password })
            // });
            // ===========================================

            await new Promise(resolve => setTimeout(resolve, 600)); // 模拟网络请求
            users[username] = { hash: hashPassword(password), createdAt: Date.now() };
            saveUsers(users);

            // 注册成功：自动登录并进入聊天页
            localStorage.setItem(TOKEN_KEY, hashToken(username));
            localStorage.setItem(USER_KEY, username);
            window.location.replace('index.html');
          } catch (err) {
            showError('注册失败，请重试');
            submitBtn.disabled = false;
            submitBtn.textContent = '注 册';
          }
          return;
        }

        // ============ 登录流程 ============
        const user = users[username];
        if (!user) { showError('该用户名尚未注册，请先注册'); usernameInput.focus(); return; }
        if (user.hash !== hashPassword(password)) { showError('密码错误，请重试'); passwordInput.focus(); return; }

        submitBtn.disabled = true;
        submitBtn.textContent = '登录中…';
        try {
          // ============【这里对接后端API】============
          // 真实后端接入示例（对接 FastAPI 多 Agent 医疗后端）：
          //
          // const res = await fetch('/api/auth/login', {
          //   method: 'POST',
          //   headers: { 'Content-Type': 'application/json' },
          //   body: JSON.stringify({ username, password })
          // });
          // const data = await res.json();
          // if (!res.ok) { showError(data.detail || '登录失败'); return; }
          // localStorage.setItem(TOKEN_KEY, data.access_token);
          // localStorage.setItem(USER_KEY, data.username);
          // window.location.replace('index.html');
          // ===========================================

          await new Promise(resolve => setTimeout(resolve, 600)); // 模拟网络请求
          localStorage.setItem(TOKEN_KEY, hashToken(username));   // 模拟后端签发的 token
          localStorage.setItem(USER_KEY, username);
          window.location.replace('index.html');
        } catch (err) {
          showError('登录失败，请重试');
          submitBtn.disabled = false;
          submitBtn.textContent = '登 录';
        }
      });
    })();
  </script>
</body>
</html>
