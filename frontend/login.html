<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>登录 - 多智能体协同 RAG 医疗咨询助手</title>

  <!-- CDN 引入 Tailwind CSS v3（无需本地依赖） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            'primary-dark': '#0E42D2',
            'primary-light': '#E8F3FF',
            'text-main': '#1D2129',
            'text-sub': '#6E7681',
            danger: '#F53F3F',
            success: '#00B42A'
          }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-primary-light via-white to-blue-50 flex items-center justify-center p-4"
      style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-primary mx-auto flex items-center justify-center text-white shadow-lg shadow-primary/30">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-text-main mt-4">多智能体协同 RAG 医疗咨询助手</h1>
      <p class="text-sm text-text-sub mt-1.5">AI 健康科普 · 在线咨询</p>
    </div>

    <!-- 登录卡片 -->
    <div class="bg-white rounded-2xl shadow-xl shadow-primary/5 border border-gray-100 p-6 sm:p-8">
      <!-- 登录 / 注册切换 -->
      <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
        <button id="loginTab" class="flex-1 py-2 rounded-lg text-sm font-medium bg-white text-primary shadow-sm transition">登录</button>
        <button id="registerTab" class="flex-1 py-2 rounded-lg text-sm font-medium text-text-sub hover:text-text-main transition">注册</button>
      </div>

      <!-- 表单 -->
      <form id="authForm" autocomplete="off">
        <div class="space-y-4">
          <div>
            <label class="block text-sm text-text-main font-medium mb-1.5">用户名</label>
            <input id="username" type="text" maxlength="20" placeholder="2-20 位字母、数字、下划线或中文"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none text-sm transition bg-[#FAFCFF]" />
          </div>
          <div>
            <label class="block text-sm text-text-main font-medium mb-1.5">密码</label>
            <div class="relative">
              <input id="password" type="password" maxlength="64" placeholder="6-64 位字符"
                class="w-full px-4 py-2.5 pr-11 rounded-xl border border-gray-200 focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none text-sm transition bg-[#FAFCFF]" />
              <!-- 显示 / 隐藏密码 -->
              <button type="button" id="togglePwd" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-sub hover:text-primary transition" aria-label="显示密码">
                <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eyeClosed" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          <!-- 注册专用：确认密码 -->
          <div id="confirmWrap" class="hidden">
            <label class="block text-sm text-text-main font-medium mb-1.5">确认密码</label>
            <input id="confirmPwd" type="password" maxlength="64" placeholder="再次输入密码"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none text-sm transition bg-[#FAFCFF]" />
          </div>
        </div>

        <!-- 错误提示 -->
        <p id="errorMsg" class="hidden text-danger text-xs mt-3 bg-red-50 rounded-lg px-3 py-2 leading-relaxed"></p>

        <!-- 提交按钮 -->
        <button type="submit" id="submitBtn"
          class="w-full mt-6 py-3 rounded-xl bg-primary hover:bg-primary-dark active:scale-[0.98] text-white text-sm font-semibold shadow-lg shadow-primary/25 transition disabled:opacity-60 disabled:active:scale-100">
          登 录
        </button>
      </form>

      <!-- 访客入口（无需注册，本地体验） -->
      <button id="guestBtn" class="w-full mt-3 py-2.5 rounded-xl border border-gray-200 text-text-sub hover:text-primary hover:border-primary hover:bg-primary-light/30 text-sm transition">
        暂不登录，以访客身份进入 →
      </button>
    </div>

    <p class="text-center text-[11px] text-text-sub mt-5 leading-relaxed px-4">
      ⚠️ AI医疗助手仅提供健康科普参考，不构成医疗诊断，如有身体不适，请及时前往医院就诊。
    </p>
  </div>

  <script>
    (function () {
      const TOKEN_KEY = 'rag_med_token';
      const USER_KEY  = 'rag_med_username';
      const API_BASE  = '';

      let isRegister = false;

      const loginTab = document.getElementById('loginTab');
      const registerTab = document.getElementById('registerTab');
      const confirmWrap = document.getElementById('confirmWrap');
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');
      const form = document.getElementById('authForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      // ================== 登录 / 注册切换 ==================
      function switchTab(register) {
        isRegister = register;
        loginTab.className = 'flex-1 py-2 rounded-lg text-sm font-medium transition ' +
          (register ? 'text-text-sub hover:text-text-main' : 'bg-white text-primary shadow-sm');
        registerTab.className = 'flex-1 py-2 rounded-lg text-sm font-medium transition ' +
          (register ? 'bg-white text-primary shadow-sm' : 'text-text-sub hover:text-text-main');
        confirmWrap.classList.toggle('hidden', !register);
        submitBtn.textContent = register ? '注 册' : '登 录';
        hideError();
      }
      loginTab.addEventListener('click', () => switchTab(false));
      registerTab.addEventListener('click', () => switchTab(true));

      // ================== 显示 / 隐藏密码 ==================
      document.getElementById('togglePwd').addEventListener('click', () => {
        const show = passwordInput.type === 'password';
        passwordInput.type = show ? 'text' : 'password';
        document.getElementById('eyeOpen').classList.toggle('hidden', show);
        document.getElementById('eyeClosed').classList.toggle('hidden', !show);
      });

      // ================== 错误提示 ==================
      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
      }
      function hideError() { errorMsg.classList.add('hidden'); }

      // ================== 请求封装 ==================
      async function postJson(path, body) {
        let resp;
        try {
          resp = await fetch(API_BASE + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
        } catch (e) {
          // 网络异常 / 后端未启动
          showError('无法连接服务器，请确认后端服务已启动后重试。');
          return null;
        }
        let data = null;
        try { data = await resp.json(); } catch (e) { /* 非 JSON 响应 */ }
        if (!resp.ok) {
          if (resp.status === 503) {
            showError((data && data.detail) || '用户系统未启用：请启动 MySQL 并设置 MYSQL_ENABLED=1 后重启服务');
            return null;
          }
          showError((data && data.detail) || ('请求失败（HTTP ' + resp.status + '）'));
          return null;
        }
        return data;
      }

      // ================== 表单提交 ==================
      form.addEventListener('submit', async e => {
        e.preventDefault();
        hideError();
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        // 前端校验（与后端规则一致）
        if (!/^[\w一-龥]{2,20}$/.test(username)) {
          showError('用户名需为 2-20 位字母、数字、下划线或中文');
          return;
        }
        if (password.length < 6 || password.length > 64) {
          showError('密码长度需为 6-64 位');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = isRegister ? '注册中…' : '登录中…';
        try {
          if (isRegister) {
            const confirmPwd = document.getElementById('confirmPwd').value;
            if (password !== confirmPwd) {
              showError('两次输入的密码不一致');
              return;
            }
            // 注册成功后自动登录，直接进入主界面
            const reg = await postJson('/api/auth/register', { username, password });
            if (!reg) return;
            const login = await postJson('/api/auth/login', { username, password });
            if (!login) {
              showError('注册成功，但自动登录失败，请手动登录。');
              switchTab(false);
              return;
            }
            localStorage.setItem(TOKEN_KEY, login.token);
            localStorage.setItem(USER_KEY, login.username);
            window.location.replace('index.html');
          } else {
            const data = await postJson('/api/auth/login', { username, password });
            if (!data) return;
            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(USER_KEY, data.username);
            window.location.replace('index.html');
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = isRegister ? '注 册' : '登 录';
        }
      });

      // ================== 访客进入 ==================
      document.getElementById('guestBtn').addEventListener('click', () => {
        window.location.replace('index.html');
      });

      // 回车提交由表单原生处理（input 在 form 内），无需额外绑定
    })();
  </script>
</body>
</html>
